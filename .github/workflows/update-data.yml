name: Aggiorna Dati GesssAI

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          pip install pandas beautifulsoup4 selenium webdriver-manager lxml openpyxl requests python-dateutil
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Configura Chrome
        run: |
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV
          echo "CHROME_DRIVER=/usr/bin/chromedriver" >> $GITHUB_ENV

      - name: Esegui scarica.py e cattura errore
        run: |
          echo "### Inizio esecuzione di scarica.py ###"
          python scarica.py 2> error_log.txt
          exit_code=$?
          echo "### Fine esecuzione con codice: $exit_code ###"
          if [ -s error_log.txt ]; then
            echo "❌ ERRORE DETTAGLIATO:"
            cat error_log.txt
          fi
          if [ $exit_code -ne 0 ]; then
            echo "❌ Lo script è fallito. Controlla l'errore qui sopra."
            exit $exit_code
          fi
        env:
          CHROME_BIN: /usr/bin/chromium-browser
          CHROME_DRIVER: /usr/bin/chromedriver
          PYTHONUNBUFFERED: 1

      - name: Crea JSON se non esiste
        run: |
          mkdir -p excel
          if [ ! -f "excel/GesssAI_Input.json" ]; then
            echo '{"championships":[],"matches":[]}' > excel/GesssAI_Input.json
            echo "JSON di esempio creato"
          fi

      - name: Deploy su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./excel
          publish_branch: gh-pages
          keep_files: false
          destination_dir: data
