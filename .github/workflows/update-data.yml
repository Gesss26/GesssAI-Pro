name: Aggiorna Dati GesssAI

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Installa dipendenze
        run: |
          pip install pandas beautifulsoup4 selenium webdriver-manager lxml openpyxl requests python-dateutil
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
      
      - name: Configura Chrome
        run: |
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV
          echo "CHROME_DRIVER=/usr/bin/chromedriver" >> $GITHUB_ENV
      
      - name: Esegui scarica.py
        run: python scarica.py
        env:
          CHROME_BIN: /usr/bin/chromium-browser
          CHROME_DRIVER: /usr/bin/chromedriver
        continue-on-error: true
      
      - name: Crea cartella excel
        run: |
          mkdir -p excel
          echo "Cartella excel creata"
      
      - name: Crea JSON se non esiste
        run: |
          if [ ! -f "excel/GesssAI_Input.json" ]; then
            echo '{"championships":[],"matches":[],"apiKeys":{},"theme":"Scuro Blu Notte","customTheme":null,"schedineHistory":[],"selectedFamiglie":["dc_under","mg_casa_ospite","over"],"exportedAt":"2026-07-29T12:00:00"}' > excel/GesssAI_Input.json
            echo "JSON di esempio creato"
          else
            echo "JSON trovato!"
          fi
      
      - name: Verifica file
        run: |
          echo "Contenuto cartella excel:"
          ls -la excel/
      
      - name: Deploy su GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./excel
          publish_branch: gh-pages
          keep_files: false
          destination_dir: data
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
