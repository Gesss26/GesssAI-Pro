<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>GesssAI-Pro v3.0 - Football Trader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2028;
    --card: #232b36;
    --banner: #2c3642;
    --text: #e6edf3;
    --text-muted: #ffff00;
    --accent: #f39c12;
    --accent2: #e67e22;
    --border: #30363d;
    --win: #6fcf97;
    --draw: #f2c94c;
    --lose: #eb5757;
    --tab-active: #f39c12;
    --pct-rosso: #eb5757;
    --pct-neutro: #8b949e;
    --pct-verde: #6fcf97;
    --pct-oro: #f39c12;
    --xG-red: #eb5757;
    --xG-white: #8b949e;
    --xG-blue: #3498db;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; }
  
  .giocata-pct {
    display: inline-block;
    font-weight: bold;
    font-size: 14px;
    padding: 2px 10px;
    border-radius: 6px;
    color: #000 !important;
  }
  .giocata-pct.flag-red { background: #eb5757; color: #000 !important; }
  .giocata-pct.flag-white { background: #8b949e; color: #000 !important; }
  .giocata-pct.flag-green { background: #6fcf97; color: #000 !important; }
  .giocata-pct.flag-bomb { 
    background: #f39c12; 
    color: #000 !important; 
    animation: bomb-glow 1s infinite alternate; 
    box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
  }
  
  .detail-stat-box { 
    padding: 8px 12px; 
    border-radius: 8px; 
    text-align: center; 
    border: 1px solid var(--border); 
    background: var(--surface); 
    transition: background 0.2s, transform 0.1s; 
    min-width: 60px; 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
  }
  .detail-stat-box:hover { transform: scale(1.02); }
  .detail-stat-box .label { 
    display: block; 
    font-size: 14px; 
    font-weight: 600; 
    color: #ffff00; 
    margin-bottom: 2px; 
  }
  .detail-stat-box .value { 
    display: block; 
    font-size: 20px; 
    font-weight: bold; 
  }
  .detail-stat-box .bomb-icon { 
    display: inline-block; 
    font-size: 20px; 
    animation: bomb-bounce 0.8s infinite ease-in-out; 
    transform-origin: center; 
    margin-left: 4px; 
  }
  
  .detail-stat-box.flag-red { background: #eb5757; }
  .detail-stat-box.flag-red .value { color: #000; }
  .detail-stat-box.flag-white { background: #8b949e; }
  .detail-stat-box.flag-white .value { color: #000; }
  .detail-stat-box.flag-green { background: #6fcf97; }
  .detail-stat-box.flag-green .value { color: #000; }
  .detail-stat-box.flag-bomb { 
    background: #f39c12; 
    animation: bomb-glow 1s infinite alternate; 
  }
  .detail-stat-box.flag-bomb .value { color: #000; }
  
  .xg-value {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 13px;
    color: #000 !important;
  }
  .xg-value.xg-red { background: #eb5757; color: #000 !important; }
  .xg-value.xg-white { background: #8b949e; color: #000 !important; }
  .xg-value.xg-blue { background: #3498db; color: #000 !important; }
  
  @keyframes bomb-glow {
    0% { box-shadow: 0 0 8px rgba(243, 156, 18, 0.4); }
    50% { box-shadow: 0 0 25px rgba(243, 156, 18, 0.8); transform: scale(1.05); }
    100% { box-shadow: 0 0 8px rgba(243, 156, 18, 0.4); }
  }
  .bomb-icon { display: inline-block; font-size: 18px; margin-left: 4px; animation: bomb-bounce 0.8s infinite ease-in-out; transform-origin: center; }
  @keyframes bomb-bounce { 0% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.3) rotate(10deg); } 100% { transform: scale(1) rotate(0deg); } }
  
  .pct-rosso { color: var(--pct-rosso) !important; font-weight: bold; }
  .pct-neutro { color: var(--pct-neutro) !important; font-weight: bold; }
  .pct-verde { color: var(--pct-verde) !important; font-weight: bold; }
  .pct-oro { color: var(--pct-oro) !important; font-weight: bold; text-shadow: 0 0 10px rgba(243, 156, 18, 0.3); }
  
  .multigol-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #000; margin: 0 2px; }
  .multigol-badge.range-01 { background: #8b949e; }
  .multigol-badge.range-02 { background: #f2c94c; }
  .multigol-badge.range-13 { background: #6fcf97; }
  .multigol-badge.range-24 { background: #f39c12; }
  .multigol-badge.range-25 { background: #e67e22; }
  .multigol-badge.range-36 { background: #eb5757; }
  .multigol-badge.range-default { background: var(--accent); }
  
  .header { background: var(--banner); padding: 16px 24px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; gap: 16px; position: relative; }

  .header .header-center .app-name { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
  .header .header-center .app-name span { display: inline-block; }
  .header .header-center .subtitle { font-size: 12px; color: var(--text-muted); }
  .clock { position: absolute; right: 24px; background: var(--surface); padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; color: var(--accent); min-width: 200px; text-align: right; }
  .clock-date { font-size: 12px; color: var(--text-muted); }
  .clock-time { font-size: 16px; color: var(--accent); }
  .tabs-nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabs-nav button { flex: 1; min-width: 120px; padding: 14px 12px; background: transparent; color: var(--text-muted); border: none; cursor: pointer; font-size: 14px; border-bottom: 3px solid transparent; transition: all 0.2s; font-weight: 600; white-space: nowrap; }
  .tabs-nav button:hover { color: var(--text); background: var(--card); }
  .tabs-nav button.active { color: var(--accent); border-bottom-color: var(--tab-active); background: var(--card); }
  .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

  @media (max-width: 768px) { .matches-grid { grid-template-columns: 1fr; } }
  
  .match-tab { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 0; border: 1px solid var(--border); border-left-width: 6px; box-shadow: 0 3px 10px rgba(0,0,0,0.4); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; }
  .match-tab:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.6); }

    position: absolute; 
    top: 10px; 
    right: 12px; 
    background: var(--accent); 
    color: #000; 
    font-weight: bold; 
    font-size: 18px; 
    padding: 2px 10px; 
    border-radius: 20px; 
    border: 2px solid var(--accent2);
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 10;
  }

  }

    animation: bomb-bounce 1s infinite ease-in-out;
    line-height: 1;
    display: inline-block;

  .match-tab-history { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 0; border: 1px solid var(--border); border-left-width: 6px; box-shadow: 0 3px 10px rgba(0,0,0,0.4); flex: 1; min-width: 300px; max-width: 420px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .match-tab-history:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.6); }
  .match-tab-history .teams-row { display: flex; justify-content: space-around; align-items: center; padding: 4px 0; }

  .match-tab-history .score-draw { color: var(--draw); }
  .match-tab-history .score-loss { color: var(--lose); }
  
  .teams-row { display: flex; justify-content: space-around; align-items: center; padding: 8px 0; gap: 8px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .team-name { font-weight: bold; font-size: 20px; text-align: center; }
  .vs { font-size: 18px; color: var(--accent); font-weight: bold; padding: 0 8px; flex-shrink: 0; }

  }

  }

    display: flex !important;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--border);
    font-weight: bold;
    color: var(--accent);
    flex-shrink: 0;

  }

    display: flex !important;

  }

  .form-row-compact { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; margin-bottom: 6px; }

  .form-bar-fill { height: 100%; background: linear-gradient(90deg, var(--win), var(--accent)); transition: width 0.3s; }
  .form-diff { text-align: center; font-size: 16px; font-weight: bold; color: var(--text-muted); margin-top: 6px; padding: 4px 8px; background: var(--surface); border-radius: 6px; }
  .form-diff span { font-weight: bold; color: var(--accent); font-size: 18px; }
  
  .form-xg { display: flex; justify-content: space-around; align-items: center; padding: 4px 0; margin-top: 2px; font-size: 13px; color: var(--text-muted); background: var(--surface); border-radius: 6px; }
  .form-xg .xg-home { color: var(--accent); font-weight: bold; }
  .form-xg .xg-away { color: var(--accent); font-weight: bold; }
  
  .bet-row-vertical { 
    display: flex; 
    flex-direction: column; 
    gap: 4px; 
    margin-top: 8px; 
  }
  .bet-item-vertical { 
    background: var(--surface); 
    padding: 4px 10px; 
    border-radius: 6px; 
    font-size: 12px; 
    border: 1px solid var(--border); 
    text-align: center; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  .bet-item-vertical .bet-label { 
    font-size: 11px; 
    text-transform: uppercase; 
    font-weight: 600; 
    letter-spacing: 0.2px; 
    color: var(--text-muted);
    flex: 0 0 auto;
  }
  .bet-item-vertical .bet-value { 
    font-weight: bold; 
    font-size: 13px; 
    color: var(--text);
    flex: 1;
    text-align: right;
  }
  .bet-item-vertical .bet-value .giocata-pct { 
    font-size: 14px; 
    padding: 2px 8px; 
    border-radius: 4px; 
    display: inline-block; 
  }
  .bet-item-vertical.bomb { 
    border-color: var(--accent); 
    background: var(--accent); 
    animation: bomb-glow 1s infinite alternate; 
  }
  .bet-item-vertical.bomb .bet-value { color: #000 !important; }
  .bet-item-vertical.bomb .bet-label { color: #000 !important; }
  .bet-item-vertical .bet-value .combinata-detail {
    font-size: 10px;
    line-height: 1.2;
    text-align: right;
    color: var(--text-muted);
  }
  
  .tab-header { padding: 4px 12px; border-radius: 6px; margin-bottom: 6px; text-align: center; color: #fff; font-weight: bold; font-size: 13px; display: inline-block; }
  .match-info { text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 6px; }
  
  .standings-table-wrap { overflow-x: auto; }
  .standings-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  .standings-table th { background: var(--surface); color: var(--text-muted); padding: 8px 6px; text-align: left; border-bottom: 2px solid var(--border); font-weight: 600; text-transform: uppercase; font-size: 11px; white-space: nowrap; }
  .standings-table td { padding: 6px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .standings-table tr.highlighted td { background: var(--accent) !important; color: #000 !important; font-weight: bold; }
  .standings-table tr:hover td { background: var(--card); }
  .standings-table .pos { font-weight: bold; color: var(--accent); text-align: center; }
  .standings-table .team-name-cell { display: flex; align-items: center; gap: 8px; }
  .standings-table .team-name-cell .team-name { font-weight: bold; font-size: 13px; }
  .standings-table .num { text-align: center; }
  .standings-table .points { font-weight: bold; color: var(--accent); text-align: center; }
  
  .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .sub-tabs button { padding: 8px 16px; background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; }
  .sub-tabs button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  
  .detail-section { margin-bottom: 20px; }
  .detail-section h4 { color: var(--accent); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  
  .detail-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .detail-row .detail-stat-box { flex: 1; min-width: 60px; }
  
  .opponents-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin: 8px 0; }

  .opponents-col .opp-item { font-size: 12px; padding: 2px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .opponents-col .opp-item:last-child { border-bottom: none; }

  .stats-two-col { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
  @media (max-width: 768px) { .stats-two-col { grid-template-columns: 1fr; } }
  .stats-placeholder { text-align: center; padding: 40px; color: var(--text-muted); font-size: 16px; }
  
  .ai-analysis-box .weather-display { background: var(--card); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; border: 1px solid var(--border); }
  .ai-analysis-box .weather-display .weather-main { display: flex; align-items: center; gap: 12px; }

  .ai-analysis-box .weather-display .weather-desc { font-size: 13px; color: var(--text-muted); }
  .ai-analysis-box .weather-display .weather-details { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); }
  @media (max-width: 768px) { .ai-analysis-box .weather-display { flex-direction: column; align-items: flex-start; } .ai-analysis-box .weather-display .weather-details { flex-wrap: wrap; gap: 8px; } }

  .freq-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -8px; padding: 0 8px; }

  .intervalli-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 8px; }

// Funzione per ottenere la città da squadra
const getCityForTeam = (teamName) => {
  if (!teamName) return null;
  if (TEAM_CITY_MAP[teamName]) return TEAM_CITY_MAP[teamName];
  for (const [key, city] of Object.entries(TEAM_CITY_MAP)) {
    if (teamName.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(teamName.toLowerCase())) {
      return city;
    }
  }
  return null;
};

// Funzione per ottenere la città da squadra o campionato
const getCityForMatch = (teamName, championship) => {
  if (!teamName) return null;
  
  // Prima cerca tramite squadra
  const cityFromTeam = getCityForTeam(teamName);
  if (cityFromTeam) return cityFromTeam;
  
  // Se non trovata, cerca tramite campionato
  const cityFromChamp = CITTÀ_PER_CAMPIONATO[championship];
  if (cityFromChamp) return cityFromChamp;
  
  // Cerca tramite campionato con match parziale
  for (const [key, city] of Object.entries(CITTÀ_PER_CAMPIONATO)) {
    if (championship && (championship.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(championship.toLowerCase()))) {
      return city;
    }
  }
  
  // Se il campionato è europeo, usa una città di default
  const europeanLeagues = ['Premier League', 'Serie A', 'Serie B', 'Bundesliga', 'Ligue 1', 
    'La Liga', 'Eredivisie', 'Primeira Liga', 'Allsvenskan', 'Eliteserien', 
    'Danish Superliga', 'Pro League', 'Championship', 'Swiss Super League', 
    'Austrian Bundesliga', 'Premier Division', 'Besta deild', 'Liga Portugal Betclic', 
    'Veikkausliiga', 'Russian Premier League'];
    
  if (championship && europeanLeagues.some(l => championship.includes(l))) {
    return 'Londra';
  }
  
  // Se il campionato contiene "Brasil", usa San Paolo
  if (championship && championship.includes('Brasil')) {
    return 'San Paolo';
  }
  
  // Se il campionato contiene "J1", usa Tokyo
  if (championship && championship.includes('J1')) {
    return 'Tokyo';
  }
  
  // Se il campionato contiene "K League", usa Seul
  if (championship && championship.includes('K League')) {
    return 'Seul';
  }
  
  // Se il campionato contiene "Liga MX", usa Città del Messico
  if (championship && championship.includes('Liga MX')) {
    return 'Città del Messico';
  }
  
  // Se il campionato contiene "Chinese", usa Pechino
  if (championship && championship.includes('Chinese')) {
    return 'Pechino';
  }
  
  // Se il campionato contiene "MLS", usa New York
  if (championship && championship.includes('MLS')) {
    return 'New York';
  }
  
  return null;
};

const deduplicateMatches = (matches) => {
  const seen = new Map();
  const result = [];
  matches.forEach(m => {
    const campionato = (m.campionato || '').trim();
    const data = m.data || '';
    const casa = (m.casa || '').trim();
    const ospiti = (m.ospiti || '').trim();
    const key = `${campionato}|${data}|${casa}|${ospiti}`;
    if (!seen.has(key)) {
      seen.set(key, m);
      result.push(m);
    } else {
      const existing = seen.get(key);
      const existingScore = (existing.golCasa !== undefined && existing.golOspite !== undefined) ? 1 : 0;
      const newScore = (m.golCasa !== undefined && m.golOspite !== undefined) ? 1 : 0;
      if (newScore > existingScore) {
        seen.set(key, m);
        const idx = result.indexOf(existing);
        if (idx !== -1) result[idx] = m;
      } else if (newScore === existingScore) {
        if (m.stato === 'Giocata' && existing.stato !== 'Giocata') {
          seen.set(key, m);
          const idx = result.indexOf(existing);
          if (idx !== -1) result[idx] = m;
        }
      }
    }
  });
  return result;
};

const getChampColor = (champName) => {
  if (!champName) return '#95a5a6';
  for (const [key, color] of Object.entries(CHAMPIONSHIP_COLORS)) {
    if (champName.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(champName.toLowerCase())) {
      return color;
    }
  }
  let hash = 0;
  for (let i = 0; i < champName.length; i++) {
    hash = champName.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 65%, 50%)`;
};

const normalizeDate = (dateStr) => {
  if (!dateStr) return null;
  if (typeof dateStr === 'number' || /^\d+$/.test(dateStr.toString().trim())) {
    const serial = parseInt(dateStr.toString().trim());
    const excelEpoch = new Date(1899, 11, 30);
    const date = new Date(excelEpoch.getTime() + serial * 86400000);
    return date.toISOString().slice(0, 10);
  }
  if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) return dateStr;
  if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) {
    const parts = dateStr.split('/');
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
  }
  try {
    const date = new Date(dateStr);
    if (!isNaN(date.getTime())) {
      return date.toISOString().slice(0, 10);
    }
  } catch(e) {}
  return dateStr;
};

const isDatePassed = (dateStr) => {
  if (!dateStr) return false;
  const normalized = normalizeDate(dateStr);
  if (!normalized) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const matchDate = new Date(normalized + 'T00:00:00');
  return matchDate < today;
};

const formatDateEU = (dateStr) => {
  if (!dateStr) return 'N/D';
  if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) return dateStr;
  if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) {
    const [y, m, d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }
  try {
    const date = new Date(dateStr);
    if (!isNaN(date.getTime())) {
      return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
    }
  } catch(e) {}
  return 'N/D';
};

const getTodayStr = () => new Date().toISOString().slice(0, 10);
const addDaysToDateStr = (dateStr, days) => {
  const date = new Date(dateStr + 'T00:00:00');
  date.setDate(date.getDate() + days);
  return date.toISOString().slice(0, 10);
};

const parseDate = (dateStr, timeStr = '00:00') => {
  if (!dateStr) return new Date(0);
  if (dateStr.match(/^\d{4}-\d{2}-\d{2}/)) return new Date(dateStr + 'T' + (timeStr || '00:00') + ':00');
  if (dateStr.match(/^\d{2}\/\d{2}\/\d{4}/)) {
    const parts = dateStr.split('/');
    const day = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1;
    const year = parseInt(parts[2], 10);
    let hours = 0, minutes = 0;
    if (timeStr && timeStr !== 'TBD' && timeStr !== 'N/D') {
      const timeParts = timeStr.split(':');
      if (timeParts.length >= 2) {
        hours = parseInt(timeParts[0], 10) || 0;
        minutes = parseInt(timeParts[1], 10) || 0;
      }
    }
    return new Date(year, month, day, hours, minutes);
  }
  try { return new Date(dateStr + ' ' + (timeStr || '00:00')); } catch(e) { return new Date(0); }
};

    return (
      <div 
        className={`team-logo-fallback ${className}`}
        style={{
          width: size,
          height: size,
          fontSize: Math.max(size * 0.35, 10),
        }}
      >
        {initials}
      </div>
    );
  }

  return (
    <img
      src={path}
      alt={teamName}
      className={`team-logo ${className}`}
      style={{
        width: size,
        height: size,
        objectFit: 'contain',
        display: 'block',
        margin: '0 auto',
        borderRadius: '4px'
      }}
      onError={() => setHasError(true)}
      loading="lazy"
    />
  );
};

const calcFormAndStats = (matches, teamName) => {
  const played = matches
    .filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName))
    .sort((a, b) => {
      const dateA = parseDate(a.data, a.ora);
      const dateB = parseDate(b.data, b.ora);
      return dateB - dateA;
    })
    .slice(0, 5);
  let form = '', points = 0;
  let golFatti = 0, golSubiti = 0;
  played.forEach(m => {
    const isHome = m.casa === teamName;
    const teamGoals = isHome ? m.golCasa : m.golOspite;
    const oppGoals = isHome ? m.golOspite : m.golCasa;
    golFatti += teamGoals;
    golSubiti += oppGoals;
    if (teamGoals > oppGoals) { form += 'V'; points += 3; }
    else if (teamGoals === oppGoals) { form += 'P'; points += 1; }
    else { form += 'S'; }
  });
  return {
    form: form || '-----',
    pct: played.length ? Math.round((points / (played.length * 3)) * 100) : 50,
    golFatti, golSubiti,
    mediaGolFatti: played.length ? (golFatti / played.length).toFixed(1) : 0,
    mediaGolSubiti: played.length ? (golSubiti / played.length).toFixed(1) : 0,
    partite: played.length
  };
};

const computeMatchStats = (match, allMatches) => {
  const homeTeam = match.casa;
  const awayTeam = match.ospiti;
  const homeGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === homeTeam || m.ospiti === homeTeam));
  const awayGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === awayTeam || m.ospiti === awayTeam));
  const allGamesMap = new Map();
  [...homeGames, ...awayGames].forEach(g => { if (!allGamesMap.has(g.id)) { allGamesMap.set(g.id, g); } });
  const allGames = Array.from(allGamesMap.values());
  const totalGames = allGames.length;
  if (totalGames === 0) return { error: 'Nessuna partita giocata per queste squadre.' };
  
  let homeWins = 0, homeDraws = 0, homeLosses = 0;
  let homeGoalsScored = 0, homeGoalsConceded = 0;
  homeGames.forEach(g => {
    const isHome = g.casa === homeTeam;
    const teamGoals = isHome ? g.golCasa : g.golOspite;
    const oppGoals = isHome ? g.golOspite : g.golCasa;
    homeGoalsScored += teamGoals;
    homeGoalsConceded += oppGoals;
    if (teamGoals > oppGoals) homeWins++;
    else if (teamGoals === oppGoals) homeDraws++;
    else homeLosses++;
  });
  
  let awayWins = 0, awayDraws = 0, awayLosses = 0;
  let awayGoalsScored = 0, awayGoalsConceded = 0;
  awayGames.forEach(g => {
    const isHome = g.casa === awayTeam;
    const teamGoals = isHome ? g.golCasa : g.golOspite;
    const oppGoals = isHome ? g.golOspite : g.golCasa;
    awayGoalsScored += teamGoals;
    awayGoalsConceded += oppGoals;
    if (teamGoals > oppGoals) awayWins++;
    else if (teamGoals === oppGoals) awayDraws++;
    else awayLosses++;
  });
  
  const p1 = totalGames > 0 ? ((homeWins + awayLosses) / totalGames) * 100 : 0;
  const pX = totalGames > 0 ? ((homeDraws + awayDraws) / totalGames) * 100 : 0;
  const p2 = totalGames > 0 ? ((homeLosses + awayWins) / totalGames) * 100 : 0;
  const p1X = totalGames > 0 ? ((homeWins + homeDraws) / totalGames) * 100 : 0;
  const p12 = totalGames > 0 ? ((homeWins + awayWins) / totalGames) * 100 : 0;
  const pX2 = totalGames > 0 ? ((homeLosses + awayWins) / totalGames) * 100 : 0;
  
  const allGamesForGoals = [...homeGames, ...awayGames];
  const goalTotals = allGamesForGoals.map(g => g.golCasa + g.golOspite);
  const thresholds = [1.5, 2.5, 3.5, 4.5];
  const underOver = thresholds.map(t => {
    const over = goalTotals.filter(gt => gt > t).length / goalTotals.length * 100;
    const under = 100 - over;
    return { threshold: t, under, over };
  });
  
  const getMultigolV2 = (team, games) => {
    const goals = games.map(g => (g.casa === team) ? g.golCasa : g.golOspite);
    const total = goals.length;
    if (total === 0) return { '0-1': 0, '0-2': 0, '1-3': 0, '2-5': 0 };
    const count = (pred) => goals.filter(pred).length / total * 100;
    return { 
      '0-1': count(g => g <= 1), 
      '0-2': count(g => g <= 2), 
      '1-3': count(g => g >= 1 && g <= 3), 
      '2-5': count(g => g >= 2 && g <= 5)
    };
  };
  
  const homeMG = getMultigolV2(homeTeam, homeGames);
  const awayMG = getMultigolV2(awayTeam, awayGames);
  
  const totalGoals = allGamesForGoals.map(g => g.golCasa + g.golOspite);
  const mgTot = {
    '1-4': totalGoals.filter(g => g >= 1 && g <= 4).length / totalGoals.length * 100,
    '2-4': totalGoals.filter(g => g >= 2 && g <= 4).length / totalGoals.length * 100,
    '2-5': totalGoals.filter(g => g >= 2 && g <= 5).length / totalGoals.length * 100,
    '3-6': totalGoals.filter(g => g >= 3 && g <= 6).length / totalGoals.length * 100,
  };
  
  return {
    p1, pX, p2, p1X, p12, pX2, underOver, homeMG, awayMG, mgTot,
    homeGames, awayGames,
    homeStats: { wins: homeWins, draws: homeDraws, losses: homeLosses, goalsScored: homeGoalsScored, goalsConceded: homeGoalsConceded, played: homeGames.length },
    awayStats: { wins: awayWins, draws: awayDraws, losses: awayLosses, goalsScored: awayGoalsScored, goalsConceded: awayGoalsConceded, played: awayGames.length },
    totalGames
  };
};

const get12Under45 = (allMatches, homeTeam, awayTeam) => {
  const homeGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === homeTeam || m.ospiti === homeTeam));
  const awayGames = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === awayTeam || m.ospiti === awayTeam));
  const allGames = [...homeGames, ...awayGames];
  const uniqueGames = Array.from(new Map(allGames.map(g => [g.id, g])).values());
  if (!uniqueGames.length) return 0;
  const count = uniqueGames.filter(g => {
    const total = g.golCasa + g.golOspite;
    return g.golCasa !== g.golOspite && total < 4.5;
  }).length;
  return (count / uniqueGames.length) * 100;
};

const getMultigolRange = (teamName, allMatches) => {
  const matches = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName));
  if (matches.length === 0) return { label: 'N/A', pct: 0, range: 'default', details: [] };
  const goals = matches.map(m => (m.casa === teamName) ? m.golCasa : m.golOspite);
  const total = goals.length;
  const range01 = goals.filter(g => g <= 1).length / total * 100;
  const range02 = goals.filter(g => g <= 2).length / total * 100;
  const range13 = goals.filter(g => g >= 1 && g <= 3).length / total * 100;
  const range24 = goals.filter(g => g >= 2 && g <= 4).length / total * 100;
  const range25 = goals.filter(g => g >= 2 && g <= 5).length / total * 100;
  const range36 = goals.filter(g => g >= 3 && g <= 6).length / total * 100;
  const ranges = [
    { label: '0-1', pct: range01, range: '01' },
    { label: '0-2', pct: range02, range: '02' },
    { label: '1-3', pct: range13, range: '13' },
    { label: '2-4', pct: range24, range: '24' },
    { label: '2-5', pct: range25, range: '25' },
    { label: '3-6', pct: range36, range: '36' },
  ];
  const best = ranges.reduce((a, b) => a.pct > b.pct ? a : b);
  return { label: best.label, pct: Math.round(best.pct), range: best.range, details: ranges.map(r => ({ ...r, pct: Math.round(r.pct) })) };
};

const calcTeamMG = (matches, teamName) => {
  const played = matches.filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName));
  if (!played.length) return '0.0-0.0';
  let scored = 0, conceded = 0;
  played.forEach(m => {
    if (m.casa === teamName) { scored += m.golCasa; conceded += m.golOspite; }
    else { scored += m.golOspite; conceded += m.golCasa; }
  });
  return `${(scored/played.length).toFixed(1)}-${(conceded/played.length).toFixed(1)}`;
};

const getGiocataPct = (giocata, stats, homeMG, awayMG, mgTot) => {
  if (stats.error) return 0;
  
  const { p1, pX, p2, p1X, p12, pX2, underOver } = stats;
  
  if (giocata === '1') return Math.round(p1);
  if (giocata === 'X') return Math.round(pX);
  if (giocata === '2') return Math.round(p2);
  
  if (giocata === '1X') return Math.round(p1X);
  if (giocata === '12') return Math.round(p12);
  if (giocata === 'X2') return Math.round(pX2);
  
  if (giocata === 'Over 1.5') return Math.round(underOver[0]?.over || 0);
  if (giocata === 'Over 2.5') return Math.round(underOver[1]?.over || 0);
  if (giocata === 'Over 3.5') return Math.round(underOver[2]?.over || 0);
  if (giocata === 'Over 4.5') return Math.round(underOver[3]?.over || 0);
  
  if (giocata === 'Under 1.5') return Math.round(underOver[0]?.under || 0);
  if (giocata === 'Under 2.5') return Math.round(underOver[1]?.under || 0);
  if (giocata === 'Under 3.5') return Math.round(underOver[2]?.under || 0);
  if (giocata === 'Under 4.5') return Math.round(underOver[3]?.under || 0);
  
  if (giocata === '0-2') return Math.round(homeMG['0-2'] || 0);
  if (giocata === '1-3') return Math.round(homeMG['1-3'] || 0);
  if (giocata === '1-4') return Math.round(mgTot['1-4'] || 0);
  if (giocata === '2-5') return Math.round(mgTot['2-5'] || 0);
  
  if (giocata.startsWith('1X+O')) { const over = giocata.replace('1X+O', 'Over '); return Math.round((p1X + getGiocataPct(over, stats, homeMG, awayMG, mgTot)) / 2); }
  if (giocata.startsWith('12+O')) { const over = giocata.replace('12+O', 'Over '); return Math.round((p12 + getGiocataPct(over, stats, homeMG, awayMG, mgTot)) / 2); }
  if (giocata.startsWith('X2+O')) { const over = giocata.replace('X2+O', 'Over '); return Math.round((pX2 + getGiocataPct(over, stats, homeMG, awayMG, mgTot)) / 2); }
  
  if (giocata.startsWith('1X+U')) { const under = giocata.replace('1X+U', 'Under '); return Math.round((p1X + getGiocataPct(under, stats, homeMG, awayMG, mgTot)) / 2); }
  if (giocata.startsWith('12+U')) { const under = giocata.replace('12+U', 'Under '); return Math.round((p12 + getGiocataPct(under, stats, homeMG, awayMG, mgTot)) / 2); }
  if (giocata.startsWith('X2+U')) { const under = giocata.replace('X2+U', 'Under '); return Math.round((pX2 + getGiocataPct(under, stats, homeMG, awayMG, mgTot)) / 2); }
  
  if (giocata.includes('+') && !giocata.includes('X') && !giocata.includes('O') && !giocata.includes('U')) {
    const parts = giocata.split('+');
    let pct1 = 0;
    if (parts[0] === '0-1') pct1 = homeMG['0-1'] || 0;
    else if (parts[0] === '0-2') pct1 = homeMG['0-2'] || 0;
    else if (parts[0] === '1-3') pct1 = homeMG['1-3'] || 0;
    else if (parts[0] === '2-5') pct1 = homeMG['2-5'] || 0;
    
    let pct2 = 0;
    if (parts[1] === '0-1') pct2 = awayMG['0-1'] || 0;
    else if (parts[1] === '0-2') pct2 = awayMG['0-2'] || 0;
    else if (parts[1] === '1-3') pct2 = awayMG['1-3'] || 0;
    else if (parts[1] === '2-5') pct2 = awayMG['2-5'] || 0;
    
    return Math.round((pct1 + pct2) / 2);
  }
  
  if (giocata.startsWith('1X+') && !giocata.includes('O') && !giocata.includes('U')) {
    const mg = giocata.replace('1X+', '');
    let pctMG = 0;
    if (mg === '0-2') pctMG = homeMG['0-2'] || 0;
    else if (mg === '1-3') pctMG = homeMG['1-3'] || 0;
    else if (mg === '1-4') pctMG = mgTot['1-4'] || 0;
    else if (mg === '2-5') pctMG = mgTot['2-5'] || 0;
    return Math.round((p1X + pctMG) / 2);
  }
  if (giocata.startsWith('12+') && !giocata.includes('O') && !giocata.includes('U')) {
    const mg = giocata.replace('12+', '');
    let pctMG = 0;
    if (mg === '0-2') pctMG = homeMG['0-2'] || 0;
    else if (mg === '1-3') pctMG = homeMG['1-3'] || 0;
    else if (mg === '1-4') pctMG = mgTot['1-4'] || 0;
    else if (mg === '2-5') pctMG = mgTot['2-5'] || 0;
    return Math.round((p12 + pctMG) / 2);
  }
  if (giocata.startsWith('X2+') && !giocata.includes('O') && !giocata.includes('U')) {
    const mg = giocata.replace('X2+', '');
    let pctMG = 0;
    if (mg === '0-2') pctMG = homeMG['0-2'] || 0;
    else if (mg === '1-3') pctMG = homeMG['1-3'] || 0;
    else if (mg === '1-4') pctMG = mgTot['1-4'] || 0;
    else if (mg === '2-5') pctMG = mgTot['2-5'] || 0;
    return Math.round((pX2 + pctMG) / 2);
  }
  
  return 0;
};

const getBestBetForFamily = (familyId, stats, homeRange, awayRange, homeMG, awayMG, mgTot) => {
  if (stats.error) return null;
  
  const family = FAMIGLIE_GIOCATE[familyId];
  if (!family) return null;
  
  let best = null;
  let bestPct = -1;
  let bestLabel = '';
  
  family.options.forEach(opt => {
    let pct = 0;
    let label = opt;
    
    if (familyId === 'dc_under' && opt === '12+U4.5') {
      pct = Math.round(get12Under45(stats._allMatches, stats._homeTeam, stats._awayTeam) || 0);
    } else if (familyId === 'mg_casa_ospite') {
      const parts = opt.split('+');
      
      let pct1 = 0;
      if (parts[0] === '0-1') pct1 = homeMG['0-1'] || 0;
      else if (parts[0] === '0-2') pct1 = homeMG['0-2'] || 0;
      else if (parts[0] === '1-3') pct1 = homeMG['1-3'] || 0;
      else if (parts[0] === '2-5') pct1 = homeMG['2-5'] || 0;
      
      let pct2 = 0;
      if (parts[1] === '0-1') pct2 = awayMG['0-1'] || 0;
      else if (parts[1] === '0-2') pct2 = awayMG['0-2'] || 0;
      else if (parts[1] === '1-3') pct2 = awayMG['1-3'] || 0;
      else if (parts[1] === '2-5') pct2 = awayMG['2-5'] || 0;
      
      pct = Math.round((pct1 + pct2) / 2);
      label = `${parts[0]}+${parts[1]}`;
    } else {
      pct = getGiocataPct(opt, stats, homeMG, awayMG, mgTot);
    }
    
    if (pct > bestPct) {
      bestPct = pct;
      best = opt;
      bestLabel = label;
    }
  });
  
  if (best && bestPct > 0) {
    return { 
      giocata: best, 
      label: bestLabel, 
      pct: bestPct,
      isBomb: bestPct >= 90
    };
  }
  
  return null;
};

const Clock = () => {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const timer = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(timer);
  }, []);
  const formatDate = (d) => {
    const days = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
    const months = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
    return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  };
  const formatTime = (d) => d.toTimeString().slice(0, 8);
  return (
    <div className="clock">
      <div className="clock-date">{formatDate(now)}</div>
      <div className="clock-time">{formatTime(now)}</div>
    </div>
  );
};

const Standings = ({ matches, filterChampionship, highlightTeams = [] }) => {
  const [view, setView] = useState('generale');
  let filtered = matches;
  if (filterChampionship && filterChampionship !== 'Tutti') {
    filtered = filtered.filter(m => m.campionato === filterChampionship);
  }
  filtered = filtered.filter(m => m.stato === 'Giocata');
  if (filtered.length === 0) return <div className="empty-state">Nessuna partita giocata per questo campionato.</div>;
  const teamStats = {};
  const addGame = (team, isHome, golFatti, golSubiti) => {
    if (!teamStats[team]) { teamStats[team] = { pg: 0, punti: 0, v: 0, p: 0, s: 0, gf: 0, gs: 0, dr: 0 }; }
    const t = teamStats[team];
    t.pg++; t.gf += golFatti; t.gs += golSubiti;
    if (golFatti > golSubiti) { t.v++; t.punti += 3; }
    else if (golFatti === golSubiti) { t.p++; t.punti += 1; }
    else { t.s++; }
  };
  filtered.forEach(m => {
    if (view === 'generale') { addGame(m.casa, true, m.golCasa, m.golOspite); addGame(m.ospiti, false, m.golOspite, m.golCasa); }
    else if (view === 'casa') { addGame(m.casa, true, m.golCasa, m.golOspite); }
    else if (view === 'ospite') { addGame(m.ospiti, false, m.golOspite, m.golCasa); }
  });
  Object.values(teamStats).forEach(t => { t.dr = t.gf - t.gs; });
  const sorted = Object.entries(teamStats).sort((a, b) => {
    if (b[1].punti !== a[1].punti) return b[1].punti - a[1].punti;
    if (b[1].dr !== a[1].dr) return b[1].dr - a[1].dr;
    return b[1].gf - a[1].gf;
  }).map(([name, stats], index) => ({ pos: index + 1, name, ...stats }));
  const getMultigolForTeam = (teamName) => getMultigolRange(teamName, matches);
  const champToShow = filterChampionship && filterChampionship !== 'Tutti' ? filterChampionship : null;
  
  return (
    <div>
      <div className="sub-tabs">
        <button className={view === 'generale' ? 'active' : ''} onClick={() => setView('generale')}>Generale</button>
        <button className={view === 'casa' ? 'active' : ''} onClick={() => setView('casa')}>Casa</button>
        <button className={view === 'ospite' ? 'active' : ''} onClick={() => setView('ospite')}>Ospite</button>
      </div>
      <div className="standings-table-wrap">
        <table className="standings-table">
          <thead><tr><th>#</th><th>Squadra</th><th className="num">PG</th><th className="num">Punti</th><th className="num">V</th><th className="num">P</th><th className="num">S</th><th className="num">GF</th><th className="num">GS</th><th className="num">DR</th><th className="num">Fascia Gol</th><th className="num">%</th></tr></thead>
          <tbody>
            {sorted.map(row => {
              const isHighlighted = highlightTeams.includes(row.name);
              const multigol = getMultigolForTeam(row.name);
              return <tr key={row.name} className={isHighlighted ? 'highlighted' : ''}>
                <td className="pos">{row.pos}</td>
                <td>
                  <div className="team-name-cell">
                    <TeamLogo teamName={row.name} championship={champToShow || 'Tutti'} size={24} />
                    <span className="team-name">{row.name}</span>
                  </div>
                </td>
                <td className="num">{row.pg}</td>
                <td className="points">{row.punti}</td>
                <td className="num">{row.v}</td>
                <td className="num">{row.p}</td>
                <td className="num">{row.s}</td>
                <td className="num">{row.gf}</td>
                <td className="num">{row.gs}</td>
                <td className="num">{row.dr > 0 ? '+' : ''}{row.dr}</td>
                <td className="num"><span className={`multigol-badge range-${multigol.range}`}>{multigol.label}</span></td>
                <td className="num" style={{color: multigol.pct >= 70 ? 'var(--win)' : (multigol.pct >= 50 ? 'var(--draw)' : 'var(--lose)')}}>{multigol.pct}%</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
};

const FamiglieSelector = ({ selectedFamiglie, setSelectedFamiglie, showAlert }) => {
  const [tempSelected, setTempSelected] = useState(selectedFamiglie);
  
  const toggleFamiglia = (familyId) => {
    setTempSelected(prev => {
      if (prev.includes(familyId)) {
        return prev.filter(id => id !== familyId);
      } else {
        if (prev.length >= 3) {
          showAlert('error', '⚠️ Puoi selezionare massimo 3 famiglie!');
          return prev;
        }
        return [...prev, familyId];
      }
    });
  };
  
  const isActive = (familyId) => tempSelected.includes(familyId);
  
  const confirmFamiglie = () => {
    if (tempSelected.length === 0) {
      showAlert('error', '⚠️ Seleziona almeno una famiglia!');
      return;
    }
    setSelectedFamiglie(tempSelected);
    const names = tempSelected.map(id => FAMIGLIE_GIOCATE[id].label);
    showAlert('success', `✅ Famiglie selezionate: ${names.join(', ')}`);
  };
  
  const resetToDefault = () => {
    setTempSelected(DEFAULT_FAMIGLIE);
    setSelectedFamiglie(DEFAULT_FAMIGLIE);
    const names = DEFAULT_FAMIGLIE.map(id => FAMIGLIE_GIOCATE[id].label);
    showAlert('info', `🔄 Famiglie ripristinate al default: ${names.join(', ')}`);
  };
  
  return (
    <div>
      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '12px'}}>
        <div>
          <h3 style={{margin: 0, color: 'var(--accent)'}}>🎯 Seleziona Famiglie di Giocate</h3>
          <div style={{fontSize: '12px', color: 'var(--text-muted)', marginTop: '4px'}}>
            Ogni famiglia mostra la MIGLIORE giocata calcolata per la partita (max 3 famiglie)
          </div>
        </div>
        <div style={{display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap'}}>
          <span className="selected-count">
            Selezionate: <span className="count-num">{tempSelected.length}</span>/3
          </span>
          <button className="btn btn-secondary" onClick={resetToDefault} style={{fontSize: '12px', padding: '6px 14px'}}>
            🔄 Default
          </button>
          <button className="btn" onClick={confirmFamiglie} style={{fontSize: '12px', padding: '6px 18px'}}>
            ✅ Conferma
          </button>
        </div>
      </div>
      
      <div className="giocate-selector-grid">
        {Object.entries(FAMIGLIE_GIOCATE).map(([key, family]) => (
          <div 
            key={key} 
            className={`giocate-category ${isActive(key) ? 'active' : ''}`}
            onClick={() => toggleFamiglia(key)}
          >
            <div className="category-title">
              <span className="icon">{family.icon}</span>
              {family.label}
              <span className="badge">{family.options.length} opzioni</span>
            </div>
            <div className="category-sub">{family.desc}</div>
            {isActive(key) && (
              <div className="category-preview">
                ✅ Attiva - sceglie la migliore tra {family.options.length} opzioni
              </div>
            )}
          </div>
        ))}
      </div>
      
      {tempSelected.length > 0 && (
        <div style={{marginTop: '16px', padding: '12px 16px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '8px'}}>
          <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>
            🔥 Famiglie attive: 
            {tempSelected.map((id, i) => {
              const family = FAMIGLIE_GIOCATE[id];
              return (
                <span key={i} style={{display: 'inline-block', margin: '2px 4px', padding: '2px 10px', background: 'var(--accent)', color: '#000', borderRadius: '4px', fontSize: '12px', fontWeight: 'bold'}}>
                  {family.icon} {family.label}
                </span>

            })}

          <div style={{fontSize: '11px', color: 'var(--text-muted)', marginTop: '4px'}}>

const MatchTab = ({ match, allMatches, onSelect, selectedFamiglie, weatherData }) => {
  if (!match) return null;
  
  const homeForm = calcFormAndStats(allMatches, match.casa);
  const awayForm = calcFormAndStats(allMatches, match.ospiti);
  const champColor = getChampColor(match.campionato);
  const flagHtml = getCountryFlagHtml(match.campionato);
  const diff = Math.abs(homeForm.pct - awayForm.pct);
  const stats = computeMatchStats(match, allMatches);
  
  stats._allMatches = allMatches;
  stats._homeTeam = match.casa;
  stats._awayTeam = match.ospiti;
  
  const renderFormSquares = (formStr) => {
    if (!formStr) return <span>N/D</span>;
    return [...formStr].map((letter, idx) => <div key={idx} className={`form-square form-square-${letter}`}>{letter}</div>);
  };
  
  const renderPct = (value) => {
    const rounded = Math.round(value);
    const cls = getPercentualeClasse(rounded);
    return <span className={`giocata-pct ${cls}`}>{rounded}%</span>;
  };
  
  const renderXgValue = (value) => {
    const num = parseFloat(value);
    if (isNaN(num)) return <span className="xg-value xg-white">N/A</span>;
    const cls = getXgClasse(num);
    return <span className={`xg-value ${cls}`}>{num.toFixed(1)}</span>;
  };
  
  const getColorForPct = (valore) => {
    if (valore >= 90) return '#f39c12';
    if (valore >= 66.67) return '#6fcf97';
    if (valore >= 33.34) return '#8b949e';
    return '#eb5757';
  };
  
  const getGiocateDaMostrare = () => {
    if (stats.error) return [];
    
    const homeMG = stats.homeMG || {};
    const awayMG = stats.awayMG || {};
    const mgTot = stats.mgTot || {};
    const homeRange = getMultigolRange(match.casa, allMatches);
    const awayRange = getMultigolRange(match.ospiti, allMatches);
    
    const giocateDaMostrare = [];
    
    selectedFamiglie.forEach(familyId => {
      const family = FAMIGLIE_GIOCATE[familyId];
      if (!family) return;
      
      const best = getBestBetForFamily(familyId, stats, homeRange, awayRange, homeMG, awayMG, mgTot);
      
      if (best && best.pct > 0) {
        giocateDaMostrare.push({
          familyId,
          familyLabel: family.label,
          familyIcon: family.icon,
          label: best.label,
          familyName: family.label,
          pct: best.pct,
          isBomb: best.pct >= 90,
          giocata: best.giocata
        });
      }
    });
    
    return giocateDaMostrare.sort((a, b) => b.pct - a.pct);
  };
  
  const giocateDaMostrare = getGiocateDaMostrare();
  const score = giocateDaMostrare.length > 0 ? Math.round(giocateDaMostrare.reduce((s, g) => s + g.pct, 0) / giocateDaMostrare.length) : 0;
  const hasBomb = giocateDaMostrare.some(g => g.isBomb);
  
  const handleClick = (e) => { e.stopPropagation(); onSelect(match.id); };
  
  const formattedDate = match.data ? formatDateEU(match.data) : 'N/D';
  const matchTime = match.ora || 'TBD';
  
  return (
    <div className="match-tab" style={{borderLeftColor: champColor}} onClick={handleClick}>
      <div className="score-badge">
        <span className={`giocata-pct ${getPercentualeClasse(score)}`}>{isNaN(score) ? 0 : score}%</span>
        {hasBomb && <span className="bomb-inline">💣</span>}
      </div>
      
      <div className="tab-header" style={{background: champColor}}>
        <span className="campionato-con-bandiera">
          <span dangerouslySetInnerHTML={{ __html: flagHtml }} />
          {match.campionato || 'N/D'}
        </span>
      </div>
      <div className="match-info">{match.campionato || 'N/D'} - Giornata: {match.round || 'N/A'}</div>
      <div className="match-info">📅 {formattedDate} - ⏰ {matchTime}</div>
      {weatherData && <div className="match-info"><WeatherBadge weatherData={weatherData} city={getCityForMatch(match.casa, match.campionato)} /></div>}
      <div className="teams-row">
        <div className="team">
          <TeamLogo teamName={match.casa} championship={match.campionato} size={50} />
          <div className="team-name">{match.casa || 'Casa'}</div>
        </div>
        <div className="vs">VS</div>
        <div className="team">
          <TeamLogo teamName={match.ospiti} championship={match.campionato} size={50} />
          <div className="team-name">{match.ospiti || 'Ospite'}</div>
        </div>
      </div>
      <div className="form-row-compact">
        <div className="form-block-compact">
          <div className="form-label">Forma</div>
          <div className="form-squares">{renderFormSquares(homeForm.form)}</div>
          <div className="form-pct-compact">{homeForm.pct || 0}%</div>
          <div className="form-bar"><div className="form-bar-fill" style={{width: (homeForm.pct || 0) + '%'}}></div></div>
        </div>
        <div className="form-block-compact">
          <div className="form-label">Forma</div>
          <div className="form-squares">{renderFormSquares(awayForm.form)}</div>
          <div className="form-pct-compact">{awayForm.pct || 0}%</div>
          <div className="form-bar"><div className="form-bar-fill" style={{width: (awayForm.pct || 0) + '%'}}></div></div>
        </div>
      </div>
      <div className="form-diff">📊 Differenza forma: <span>{isNaN(diff) ? 0 : diff}%</span></div>
      <div className="form-xg">
        <span className="xg-home">⚽ xG {match.casa}: {renderXgValue(homeForm.mediaGolFatti || 0)}</span>
        <span className="xg-away">⚽ xG {match.ospiti}: {renderXgValue(awayForm.mediaGolFatti || 0)}</span>
      </div>
      
      <div className="bet-row-vertical">
        {giocateDaMostrare.length > 0 ? (
          giocateDaMostrare.map((g, idx) => (
            <div key={idx} className={`bet-item-vertical ${g.isBomb ? 'bomb' : ''}`}>
              <span className="bet-label" style={{color: getColorForPct(g.pct)}}>
                {g.isBomb && '💣 '}
                <span style={{fontWeight: 'bold', fontSize: '13px'}}>{g.label}</span>
              </span>
              <span className="bet-value">
                <span className={`giocata-pct ${getPercentualeClasse(g.pct)}`}>
                  {g.pct}% {g.isBomb && <span className="bomb-icon">💣</span>}
                </span>
                <div className="combinata-detail" style={{fontSize: '10px', color: 'var(--text-muted)'}}>
                  {g.familyIcon} {g.familyName}
                </div>
              </span>
            </div>
          ))
        ) : (
          <div className="bet-item-vertical" style={{textAlign: 'center', color: 'var(--text-muted)'}}>
            <span>Nessuna giocata disponibile</span>
          </div>
        )}
      </div>
    </div>
  );
};

    const isHome = game.casa === team;
    const teamGoals = isHome ? game.golCasa : game.golOspite;
    const oppGoals = isHome ? game.golOspite : game.golCasa;
    if (teamGoals > oppGoals) return 'win';

const RisultatiFrequenti = ({ teamName, allMatches }) => {
  const getFrequenti = (team) => {
    const matches = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === team || m.ospiti === team))
      .sort((a,b) => { const dateA = parseDate(a.data, a.ora); const dateB = parseDate(b.data, b.ora); return dateB - dateA; });
    if (matches.length === 0) return [];
    const freq = {};
    matches.forEach(m => {
      const isHome = m.casa === team;
      const teamGoals = isHome ? m.golCasa : m.golOspite;
      const oppGoals = isHome ? m.golOspite : m.golCasa;
      let resultType = '';
      if (teamGoals > oppGoals) resultType = 'V';
      else if (teamGoals === oppGoals) resultType = 'P';
      else resultType = 'S';
      const key = `${teamGoals}-${oppGoals}`;
      if (!freq[key]) { freq[key] = { risultato: key, count: 0, tipo: resultType, golFatti: teamGoals, golSubiti: oppGoals }; }
      freq[key].count++;
    });
    return Object.values(freq).sort((a, b) => b.count - a.count).slice(0, 8);
  };
  const data = getFrequenti(teamName);
  if (data.length === 0) {
    return <div className="card" style={{height: '100%', minHeight: '200px'}}><h4>📊 Risultati Frequenti - {teamName}</h4><div style={{textAlign: 'center', padding: '20px', color: 'var(--text-muted)'}}>Nessuna partita disponibile per {teamName}</div></div>;
  }
  const totalMatches = data.reduce((sum, d) => sum + d.count, 0);
  const getResultColor = (tipo) => { if (tipo === 'V') return 'var(--win)'; if (tipo === 'P') return 'var(--draw)'; return 'var(--lose)'; };
  return (
    <div className="card" style={{height: '100%', minHeight: '280px', overflow: 'hidden'}}>
      <h4 style={{fontSize: '14px', marginBottom: '4px'}}>📊 Risultati Frequenti - {teamName}</h4>
      <div style={{fontSize: '11px', color: 'var(--text-muted)', marginBottom: '6px'}}>📅 {totalMatches} partite giocate</div>
      <div className="freq-table-wrap">
        <table className="freq-table">
          <thead><tr><th>#</th><th>Risultato</th><th>Freq.</th><th>%</th></tr></thead>
          <tbody>
            {data.map((d, idx) => {
              const pct = Math.round((d.count / totalMatches) * 100);
              const color = getResultColor(d.tipo);
              return (
                <tr key={idx}>
                  <td style={{fontWeight: 'bold', color: 'var(--accent)'}}>#{idx + 1}</td>
                  <td><div style={{display: 'flex', alignItems: 'center', gap: '8px', justifyContent: 'center'}}><span style={{display: 'inline-block', width: '24px', height: '24px', borderRadius: '4px', backgroundColor: color, border: '1px solid var(--border)', flexShrink: 0}} /><span style={{fontSize: '16px', fontWeight: 'bold', color: color}}>{d.risultato}</span></div></td>
                  <td style={{fontWeight: 'bold'}}>{d.count}x</td>
                  <td><div style={{display: 'flex', alignItems: 'center', gap: '4px', justifyContent: 'center'}}><span style={{fontWeight: 'bold', color: color, fontSize: '13px'}}>{pct}%</span><div className="form-bar" style={{width: '40px', margin: '0'}}><div className="form-bar-fill" style={{width: `${Math.min(pct, 100)}%`, background: color}} /></div></div></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
};

const FrequenzaGol = ({ teamName, allMatches }) => {

  const sommaGol = golFatti.reduce((s, g) => s + g, 0);

  const colorMap = {
    0: 'var(--lose)',
    1: 'var(--draw)',
    2: 'var(--win)',

    4: 'var(--accent)',

  };
  return (
    <div className="card" style={{ padding: '12px', height: '100%', minHeight: '150px' }}>

        {Object.entries(freq).map(([key, count]) => {
          const pct = Math.round((count / total) * 100);
          const color = colorMap[key] || 'var(--text-muted)';

const IndiceAffidabilita = ({ teamName, allMatches }) => {
  const teamMatches = allMatches.filter(m => m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName));
  const count = teamMatches.length;
  if (count === 0) return null;
  const affidabilita = Math.min(count / 20 * 100, 100);
  const results = teamMatches.map(m => {
    const isHome = m.casa === teamName;
    const teamGoals = isHome ? m.golCasa : m.golOspite;
    const oppGoals = isHome ? m.golOspite : m.golCasa;
    return teamGoals > oppGoals ? 3 : (teamGoals === oppGoals ? 1 : 0);
  });
  const media = results.reduce((s, r) => s + r, 0) / results.length;
  const varianza = results.reduce((s, r) => s + Math.pow(r - media, 2), 0) / results.length;
  const stabilita = Math.max(0, 100 - (varianza / 4 * 100));
  return (
    <div className="card">
      <h4>🎯 Indice di Affidabilità - {teamName}</h4>
      <div className="affidabilita-grid">
        <div className="affidabilita-item">
          <div className="affidabilita-value" style={{color: affidabilita > 70 ? 'var(--win)' : 'var(--draw)'}}>{Math.round(affidabilita)}%</div>
          <div className="affidabilita-label">Affidabilità</div>
          <div className="form-bar"><div className="form-bar-fill" style={{width: `${affidabilita}%`, background: affidabilita > 70 ? 'var(--win)' : 'var(--draw)'}} /></div>
        </div>
        <div className="affidabilita-item">
          <div className="affidabilita-value" style={{color: stabilita > 60 ? 'var(--win)' : 'var(--draw)'}}>{Math.round(stabilita)}%</div>
          <div className="affidabilita-label">Stabilità</div>
          <div className="form-bar"><div className="form-bar-fill" style={{width: `${stabilita}%`, background: stabilita > 60 ? 'var(--win)' : 'var(--draw)'}} /></div>
        </div>
        <div className="affidabilita-item">
          <div className="affidabilita-value">{count}</div>
          <div className="affidabilita-label">Partite analizzate</div>
          <div style={{fontSize: '11px', color: 'var(--text-muted)'}}>{count < 10 ? '⚠️ Poche partite' : '✅ Campione sufficiente'}</div>
        </div>
      </div>
    </div>
  );
};

const AnalisiMeteo = ({ matches, weatherCache }) => {
  const analyzeWeatherImpact = () => {
    const analysis = { pioggia: { totale: 0, over25: 0, gol: 0, over35: 0 }, sole: { totale: 0, over25: 0, gol: 0, over35: 0 }, vento: { totale: 0, over25: 0, gol: 0, over35: 0 }, freddo: { totale: 0, over25: 0, gol: 0, over35: 0 } };
    matches.filter(m => m.stato === 'Giocata').forEach(m => {
      const weather = weatherCache[`${m.campionato}_${m.data}`];
      if (!weather) return;
      const total = m.golCasa + m.golOspite;
      const isOver25 = total > 2.5;
      const isOver35 = total > 3.5;
      const isGol = m.golCasa > 0 && m.golOspite > 0;
      let condition = 'sole';
      if (weather.rain > 1) condition = 'pioggia';
      else if (weather.wind_speed > 5) condition = 'vento';
      else if (weather.temp < 5) condition = 'freddo';
      analysis[condition].totale++;
      if (isOver25) analysis[condition].over25++;
      if (isOver35) analysis[condition].over35++;
      if (isGol) analysis[condition].gol++;
    });
    return analysis;
  };
  const data = analyzeWeatherImpact();
  const entries = Object.entries(data);
  if (entries.every(([_, s]) => s.totale === 0)) return null;
  return (
    <div className="card">
      <h4>🌤️ Impatto Meteo sui Risultati</h4>
      <div className="weather-impact-grid">
        {entries.map(([condition, stats]) => {
          const pctOver25 = stats.totale ? Math.round((stats.over25 / stats.totale) * 100) : 0;
          const pctOver35 = stats.totale ? Math.round((stats.over35 / stats.totale) * 100) : 0;
          const pctGol = stats.totale ? Math.round((stats.gol / stats.totale) * 100) : 0;
          const emoji = condition === 'pioggia' ? '🌧️' : (condition === 'vento' ? '💨' : (condition === 'freddo' ? '❄️' : '☀️'));
          return (
            <div key={condition} className="weather-stat">
              <div className="weather-icon">{emoji}</div>
              <div className="weather-label">{condition}</div>
              <div className="weather-pct"><span>Over 2.5: {pctOver25}%</span><div className="form-bar"><div className="form-bar-fill" style={{width: `${pctOver25}%`, background: pctOver25 > 60 ? 'var(--win)' : 'var(--draw)'}} /></div></div>
              <div className="weather-pct"><span>Over 3.5: {pctOver35}%</span><div className="form-bar"><div className="form-bar-fill" style={{width: `${pctOver35}%`, background: pctOver35 > 40 ? 'var(--win)' : 'var(--draw)'}} /></div></div>
              <div className="weather-pct"><span>Gol (GG): {pctGol}%</span><div className="form-bar"><div className="form-bar-fill" style={{width: `${pctGol}%`, background: pctGol > 60 ? 'var(--win)' : 'var(--draw)'}} /></div></div>
              <div className="weather-count">📊 {stats.totale} partite</div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

// ============================================================
// FUNZIONI PER SIMULAZIONE MONTE CARLO + POISSON
// ============================================================

/**
 * Calcola la media gol di una squadra (attacco e difesa)
 */
const getTeamPoissonParams = (teamName, allMatches) => {
  const matches = allMatches.filter(m => 
    m.stato === 'Giocata' && (m.casa === teamName || m.ospiti === teamName)
  );
  
  if (matches.length < 3) {
    return { attacco: 1.2, difesa: 1.2, partite: matches.length };
  }
  
  let golFatti = 0, golSubiti = 0;
  matches.forEach(m => {
    const isHome = m.casa === teamName;
    golFatti += isHome ? m.golCasa : m.golOspite;
    golSubiti += isHome ? m.golOspite : m.golCasa;
  });
  
  const mediaFatti = golFatti / matches.length;
  const mediaSubiti = golSubiti / matches.length;
  
  // Normalizzazione rispetto alla media campionato (approssimata)
  const leagueAvg = 1.35;
  const attacco = Math.max(0.3, mediaFatti / leagueAvg);
  const difesa = Math.max(0.3, mediaSubiti / leagueAvg);
  
  return { attacco, difesa, partite: matches.length };
};

/**
 * Simula una partita con distribuzione di Poisson
 * Restituisce { golCasa, golOspite }
 */
const simulatePoissonMatch = (lambdaCasa, lambdaOspite) => {
  const poisson = (lambda) => {
    if (lambda < 0) lambda = 0;
    let L = Math.exp(-lambda);
    let k = 0;
    let p = 1;
    do {
      k++;
      p *= Math.random();
    } while (p > L);
    return k - 1;
  };
  
  // Aggiungi un po' di varianza per rendere più realistico
  const randomFactorCasa = 0.85 + Math.random() * 0.3;
  const randomFactorOspite = 0.85 + Math.random() * 0.3;
  
  return {
    golCasa: poisson(lambdaCasa * randomFactorCasa),
    golOspite: poisson(lambdaOspite * randomFactorOspite)
  };
};

/**
 * Simula N partite con metodo Monte Carlo + Poisson
 * Restituisce statistiche dettagliate
 */
const simulateMatches = (homeTeam, awayTeam, allMatches, numSimulations = 1000) => {
  // Calcola parametri Poisson per le due squadre
  const homeParams = getTeamPoissonParams(homeTeam, allMatches);
  const awayParams = getTeamPoissonParams(awayTeam, allMatches);
  
  // Forza minima per evitare divisioni per zero
  const homeAttacco = Math.max(0.5, homeParams.attacco);
  const homeDifesa = Math.max(0.5, homeParams.difesa);
  const awayAttacco = Math.max(0.5, awayParams.attacco);
  const awayDifesa = Math.max(0.5, awayParams.difesa);
  
  // Lambda per Poisson
  const lambdaCasa = homeAttacco * awayDifesa * 1.1;
  const lambdaOspite = awayAttacco * homeDifesa * 0.9;
  
  // Variabili per accumulare statistiche
  let homeWins = 0, draws = 0, awayWins = 0;
  let over15 = 0, over25 = 0, over35 = 0, over45 = 0;
  let under15 = 0, under25 = 0, under35 = 0, under45 = 0;
  let gg = 0, ng = 0;
  let risultati = {};
  
  // Simula N partite
  for (let i = 0; i < numSimulations; i++) {
    const result = simulatePoissonMatch(lambdaCasa, lambdaOspite);
    const golCasa = result.golCasa;
    const golOspite = result.golOspite;
    const total = golCasa + golOspite;
    
    // Risultato
    if (golCasa > golOspite) homeWins++;
    else if (golCasa === golOspite) draws++;
    else awayWins++;
    
    // Under/Over
    if (total > 1.5) over15++; else under15++;
    if (total > 2.5) over25++; else under25++;
    if (total > 3.5) over35++; else under35++;
    if (total > 4.5) over45++; else under45++;
    
    // Gol/No Gol
    if (golCasa > 0 && golOspite > 0) gg++;
    else ng++;
    
    // Risultati esatti
    const key = `${golCasa}-${golOspite}`;
    if (!risultati[key]) risultati[key] = 0;
    risultati[key]++;
  }
  
  // Calcola percentuali
  const n = numSimulations;
  const pct = (val) => Math.round((val / n) * 100);
  
  // Trova il risultato più probabile
  let maxResult = '';
  let maxCount = 0;
  for (const [key, count] of Object.entries(risultati)) {
    if (count > maxCount) {
      maxCount = count;
      maxResult = key;
    }
  }
  
  // Calcola 12+Under4.5 (intersezione: esito diverso da pareggio E total < 4.5)
  let count12Under45 = 0;
  for (const [key, count] of Object.entries(risultati)) {
    const parts = key.split('-');
    const gC = parseInt(parts[0]);
    const gO = parseInt(parts[1]);
    if (gC !== gO && (gC + gO) < 4.5) {
      count12Under45 += count;
    }
  }
  const pct12Under45 = Math.round((count12Under45 / n) * 100);
  
  // Calcola Multigol combinata per casa e ospite
  const homeRanges = ['0-1', '0-2', '1-3', '2-5'];
  const awayRanges = ['0-1', '0-2', '1-3', '2-5'];
  
  let homeRangeCounts = {};
  let awayRangeCounts = {};
  
  homeRanges.forEach(r => homeRangeCounts[r] = 0);
  awayRanges.forEach(r => awayRangeCounts[r] = 0);
  
  for (const [key, count] of Object.entries(risultati)) {
    const parts = key.split('-');
    const gC = parseInt(parts[0]);
    const gO = parseInt(parts[1]);
    
    if (gC <= 1) homeRangeCounts['0-1'] += count;
    else if (gC <= 2) homeRangeCounts['0-2'] += count;
    else if (gC <= 3) homeRangeCounts['1-3'] += count;
    else homeRangeCounts['2-5'] += count;
    
    if (gO <= 1) awayRangeCounts['0-1'] += count;
    else if (gO <= 2) awayRangeCounts['0-2'] += count;
    else if (gO <= 3) awayRangeCounts['1-3'] += count;
    else awayRangeCounts['2-5'] += count;
  }
  
  // Trova il miglior range per casa e ospite
  let bestHomeRange = '0-1';
  let bestHomePct = 0;
  let bestAwayRange = '0-1';
  let bestAwayPct = 0;
  
  for (const [range, count] of Object.entries(homeRangeCounts)) {
    const pctVal = Math.round((count / n) * 100);
    if (pctVal > bestHomePct) {
      bestHomePct = pctVal;
      bestHomeRange = range;
    }
  }
  
  for (const [range, count] of Object.entries(awayRangeCounts)) {
    const pctVal = Math.round((count / n) * 100);
    if (pctVal > bestAwayPct) {
      bestAwayPct = pctVal;
      bestAwayRange = range;
    }
  }
  
  const combinataLabel = `${bestHomeRange} + ${bestAwayRange}`;
  const combinataPct = Math.round((bestHomePct + bestAwayPct) / 2);
  
  return {
    homeWins: pct(homeWins),
    draws: pct(draws),
    awayWins: pct(awayWins),
    over15: pct(over15),
    under15: pct(under15),
    over25: pct(over25),
    under25: pct(under25),
    over35: pct(over35),
    under35: pct(under35),
    over45: pct(over45),
    under45: pct(under45),
    gg: pct(gg),
    ng: pct(ng),
    pct12Under45: pct12Under45,
    maxResult: maxResult,
    maxResultPct: pct(maxCount),
    lambdaCasa: lambdaCasa.toFixed(2),
    lambdaOspite: lambdaOspite.toFixed(2),
    homeAttacco: homeAttacco.toFixed(2),
    homeDifesa: homeDifesa.toFixed(2),
    awayAttacco: awayAttacco.toFixed(2),
    awayDifesa: awayDifesa.toFixed(2),
    partiteAnalizzate: Math.min(homeParams.partite, awayParams.partite),
    numSimulations: n,
    risultati,
    combinataLabel: combinataLabel,
    combinataPct: combinataPct,
    bestHomeRange: bestHomeRange,
    bestHomePct: bestHomePct,
    bestAwayRange: bestAwayRange,
    bestAwayPct: bestAwayPct
  };

const AIAnalysis = ({ match, allMatches }) => {
  const [monteCarloResult, setMonteCarloResult] = useState(null);
  const [simulationLoading, setSimulationLoading] = useState(false);
  const [error, setError] = useState(null);

  const runMonteCarloSimulation = (homeTeam, awayTeam, allMatches) => {
    setSimulationLoading(true);
    setError(null);
    try {
      const result = simulateMatches(homeTeam, awayTeam, allMatches, 1000);
      setMonteCarloResult(result);
      
      const storageKey = `ft_mc_${match.id}`;
      localStorage.setItem(storageKey, JSON.stringify(result));
      
      return result;
    } catch (e) {
      console.warn('Errore simulazione Monte Carlo:', e);
      setError('Errore durante la simulazione: ' + e.message);
      return null;
    } finally {
      setSimulationLoading(false);
    }
  };

  useEffect(() => {
    if (!match) return;
    const storageKey = `ft_mc_${match.id}`;
    const saved = localStorage.getItem(storageKey);
    if (saved) {
      try { 
        const parsed = JSON.parse(saved); 
        setMonteCarloResult(parsed);
        setError(null);
        return; 
      } catch (e) {}
    }
    if (match && allMatches.length > 0) {
      runMonteCarloSimulation(match.casa, match.ospiti, allMatches);
    }
  }, [match]);

  const refreshAnalysis = () => {
    if (match) { 
      const storageKey = `ft_mc_${match.id}`; 
      localStorage.removeItem(storageKey); 
      setMonteCarloResult(null);
      runMonteCarloSimulation(match.casa, match.ospiti, allMatches);
    }
  };

  if (!match) return null;

  if (simulationLoading) { 
    return <div className="ai-analysis-loading">⏳ Simulazione Monte Carlo in corso... ({Math.floor(Math.random() * 300 + 700)} partite simulate)</div>; 
  }

  if (error) {
    return (
      <div className="ai-analysis-error">
        <span>⚠️ {error}</span>
        <div style={{marginTop:'8px'}}>
          <button className="btn-go-key" onClick={refreshAnalysis}>🔄 Riprova</button>
        </div>
      </div>
    );
  }

  if (!monteCarloResult) {
    return (
      <div className="card">
        <p style={{color:'var(--text-muted)', marginBottom:'8px'}}>⏳ Caricamento simulazione Monte Carlo...</p>
        <button className="btn" onClick={() => runMonteCarloSimulation(match.casa, match.ospiti, allMatches)}>📊 Avvia Simulazione</button>
      </div>
    );
  }

  const mc = monteCarloResult;

  const renderPctBox = (value, label, icon = '') => {
    const rounded = Math.round(value);
    let cls = 'flag-white';
    let isBomb = false;
    if (rounded >= 90) { cls = 'flag-bomb'; isBomb = true; }
    else if (rounded >= 66.67) cls = 'flag-green';
    else if (rounded >= 33.34) cls = 'flag-white';
    else cls = 'flag-red';
    
    return (
      <div style={{
        background: 'var(--card)',
        padding: '12px 16px',
        borderRadius: '8px',
        textAlign: 'center',
        border: isBomb ? '2px solid var(--accent)' : '1px solid var(--border)',
        flex: '1',
        minWidth: '100px'
      }}>
        <div style={{fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase', fontWeight: 'bold'}}>
          {icon} {label}
        </div>
        <div style={{fontSize: '28px', fontWeight: 'bold', marginTop: '4px'}}>
          <span className={`giocata-pct ${cls}`}>
            {rounded}% {isBomb && <span className="bomb-icon">💣</span>}
          </span>
        </div>
      </div>
    );
  };

  return (
    <div className="ai-analysis-box">
      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', flexWrap: 'wrap', gap: '8px'}}>

        </div>
      </div>
      
      {/* 1X2 + 12+Under4.5 + Risultato più probabile */}
      <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', background: 'var(--card)', padding: '12px', borderRadius: '8px', marginTop: '12px', border: '2px solid var(--accent)'}}>
        <div style={{textAlign: 'center'}}>
          <div style={{fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase'}}>1 - X - 2</div>
          <div style={{fontSize: '18px', fontWeight: 'bold'}}>
            <span style={{color: mc.homeWins > mc.awayWins ? 'var(--win)' : 'var(--text)'}}>{mc.homeWins}%</span>
            <span style={{color: 'var(--draw)', margin:'0 4px'}}>|</span>

        <div style={{textAlign: 'center'}}>
          <div style={{fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase'}}>12+Under 4.5</div>

const WeatherProfessionale = ({ weatherData, city, matchDate }) => {
  if (!weatherData) {
    return (
      <div className="weather-professionale" style={{textAlign: 'center', color: 'var(--text-muted)'}}>
        <div style={{fontSize: '48px', marginBottom: '8px'}}>🌤️</div>
        <p>Dati meteo non disponibili per {city || 'questa località'}</p>
        <p style={{fontSize: '12px'}}>Open-Meteo è gratuito e non richiede chiave API</p>
      </div>
    );
  }

  const getWeatherIcon = (desc, rain) => {
    if (!desc) return '🌤️';
    const d = desc.toLowerCase();
    
    if (rain > 5) return '🌧️';
    if (rain > 1) return '🌦️';
    
    if (d.includes('sereno')) return '☀️';
    if (d.includes('nuvoloso') || d.includes('coperto')) return '☁️';
    if (d.includes('nebbia')) return '🌫️';
    if (d.includes('pioggia')) return '🌧️';
    if (d.includes('temporale')) return '⛈️';
    if (d.includes('neve')) return '❄️';
    return '🌤️';
  };

  const getRiskLevel = (weather) => {
    let risk = 0;
    if (weather.rain > 5) risk += 3;
    else if (weather.rain > 1) risk += 2;
    else if (weather.rain > 0.5) risk += 1;
    if (weather.wind_speed > 15) risk += 3;
    else if (weather.wind_speed > 10) risk += 2;
    else if (weather.wind_speed > 5) risk += 1;
    if (weather.temp < -5 || weather.temp > 35) risk += 2;
    else if (weather.temp < 0 || weather.temp > 30) risk += 1;
    if (weather.weather && (weather.weather.includes('Temporale') || weather.weather.includes('temporale'))) risk += 3;
    
    if (risk >= 6) return { level: 'high', label: '🔴 ALTO - Rischio di rinvio o condizioni proibitive', color: 'var(--lose)' };
    if (risk >= 4) return { level: 'medium', label: '🟡 MEDIO - Possibili difficoltà per i giocatori', color: 'var(--draw)' };
    if (risk >= 2) return { level: 'low', label: '🟢 BASSO - Condizioni accettabili', color: 'var(--win)' };
    return { level: 'low', label: '🟢 OTTIMALE - Condizioni perfette per il calcio', color: 'var(--win)' };
  };

  const risk = getRiskLevel(weatherData);
  const icon = getWeatherIcon(weatherData.weather, weatherData.rain);

  return (
    <div className="weather-professionale">
      <div className="weather-header">
        <div className="weather-icon-main">{icon}</div>
        <div className="weather-info-main">
          <div className="weather-temp-main">{Math.round(weatherData.temp)}°C</div>
          <div className="weather-desc-main">{weatherData.weather || 'N/A'}</div>
          <div className="weather-city-main">📍 {city || 'Località non specificata'} • 📅 {weatherData.forecast_date || matchDate || 'N/A'}</div>
        </div>
        <div style={{textAlign: 'right', minWidth: '100px'}}>
          <div style={{fontSize: '14px', color: 'var(--text-muted)'}}>Temp. min/max</div>
          <div style={{fontSize: '20px', fontWeight: 'bold', color: 'var(--accent)'}}>
            {Math.round(weatherData.temp_min)}° / {Math.round(weatherData.temp_max)}°
          </div>
        </div>
      </div>

      <div className="weather-details-grid">
        <div className="weather-detail-item">
          <div className="wd-icon">💨</div>
          <div className="wd-value">{Math.round(weatherData.wind_speed)} m/s</div>
          <div className="wd-label">Vento</div>
        </div>
        <div className="weather-detail-item">
          <div className="wd-icon">🌧️</div>
          <div className="wd-value">{weatherData.rain > 0 ? weatherData.rain + ' mm' : '0 mm'}</div>
          <div className="wd-label">Precipitazioni</div>
        </div>
      </div>

      <div className="weather-risk">
        <span className="risk-icon">⚠️</span>
        <span className="risk-text"><b>Valutazione meteo:</b> {risk.label}</span>
        <span className={`risk-badge ${risk.level}`}>{risk.level.toUpperCase()}</span>
      </div>
    </div>
  );
};

const CittaMeteo = ({ matches }) => {
  const [cities, setCities] = useState([]);
  useEffect(() => {
    const uniqueCities = new Set();
    matches.forEach(m => {
      const city = getCityForMatch(m.casa, m.campionato);
      if (city) uniqueCities.add(city);
    });
    setCities(Array.from(uniqueCities).sort());
  }, [matches]);
  return (
    <div className="card">
      <h4>🌍 Città Meteo ({cities.length})</h4>
      <div className="citta-meteo-grid">
        {cities.map(city => {
          const squadre = matches.filter(m => getCityForMatch(m.casa, m.campionato) === city).map(m => m.casa);
          const uniqueSquadre = [...new Set(squadre)];
          return (
            <div key={city} className="citta-meteo-item">
              <span className="citta-nome">📍 {city}</span>
              <span className="citta-squadre">{uniqueSquadre.slice(0, 3).join(', ')}{uniqueSquadre.length > 3 ? ` +${uniqueSquadre.length - 3}` : ''}</span>

          );

};

  };

  if (viewMode === 'mobile') {
    return (
      <div style={{display: 'flex', justifyContent: 'center', alignItems: 'flex-start', padding: '20px', minHeight: '100vh', background: '#0a0a1a'}}>
        <div className="phone-simulator">
          <div className="phone-notch">
            <div className="notch-speaker"></div>
            <div className="notch-camera"></div>
          </div>
          <div className="phone-screen">
            <div className="phone-scroll" style={{paddingTop: '32px'}}>
              {renderAppContent()}
            </div>
            <div className="phone-home-indicator"></div>
          </div>
        </div>
      </div>
    );
  }

  return renderAppContent();
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
