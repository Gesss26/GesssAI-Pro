const FileImporter = ({ matches, setMatches, championships, setChampionships, loading, setLoading, showAlert }) => {
  const [file, setFile] = useState(null);
  const [parsedData, setParsedData] = useState([]);
  const [columns, setColumns] = useState([]);
  const [mapping, setMapping] = useState({
    campionato: '',
    giornata: '',
    data: '',
    ora: '',
    squadraCasa: '',
    squadraOspite: '',
    golCasa: '',
    golOspite: '',
    stato: '',
    risultato: ''
  });
  const [previewRows, setPreviewRows] = useState([]);
  const [isDragging, setIsDragging] = useState(false);
  const [importing, setImporting] = useState(false);
  const fileInputRef = useRef(null);

  const requiredFields = ['campionato', 'data', 'squadraCasa', 'squadraOspite'];

  const handleFileDrop = (e) => {
    e.preventDefault();
    setIsDragging(false);
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      processFile(files[0]);
    }
  };

  const handleFileSelect = (e) => {
    const files = e.target.files;
    if (files.length > 0) {
      processFile(files[0]);
    }
  };

  const processFile = (file) => {
    const validTypes = ['application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'application/vnd.ms-excel', 'text/csv'];
    const ext = file.name.split('.').pop().toLowerCase();
    if (!validTypes.includes(file.type) && !['xlsx', 'xls', 'csv'].includes(ext)) {
      showAlert('error', '❌ Formato non supportato. Usa .xlsx, .xls o .csv');
      return;
    }

    setFile(file);
    setImporting(true);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

        if (jsonData.length === 0) {
          showAlert('error', '❌ Il file è vuoto o non contiene dati leggibili.');
          setImporting(false);
          return;
        }

        const cols = Object.keys(jsonData[0]);
        setColumns(cols);
        setParsedData(jsonData);
        setPreviewRows(jsonData.slice(0, 10));

        const autoMapping = {};
        const colLower = cols.map(c => c.toLowerCase().trim());
        
        const findCol = (keywords) => {
          for (const keyword of keywords) {
            const index = colLower.findIndex(c => c.includes(keyword));
            if (index !== -1) return cols[index];
          }
          return '';
        };

        autoMapping.campionato = findCol(['campionato', 'league', 'camp', 'campionato']);
        autoMapping.giornata = findCol(['giornata', 'round', 'giorn', 'wk']);
        autoMapping.data = findCol(['data', 'date', 'giorno']);
        autoMapping.ora = findCol(['ora', 'time', 'orario', 'hour']);
        autoMapping.squadraCasa = findCol(['squadra casa', 'home', 'casa', 'home team', 'home_team']);
        autoMapping.squadraOspite = findCol(['squadra ospite', 'away', 'ospite', 'away team', 'away_team']);
        autoMapping.golCasa = findCol(['gol casa', 'home goals', 'goal casa', 'home_goals']);
        autoMapping.golOspite = findCol(['gol ospite', 'away goals', 'goal ospite', 'away_goals']);
        autoMapping.stato = findCol(['stato', 'status', 'risultato', 'result']);
        autoMapping.risultato = findCol(['risultato', 'result', 'score', 'ris']);

        setMapping(autoMapping);
        
        const previewWithStatus = getPreviewWithStatus(jsonData.slice(0, 10));
        setPreviewRows(previewWithStatus);
        
        const giocateCount = previewWithStatus.filter(r => r['Stato (calcolato)'] === 'Giocata').length;
        const futureCount = previewWithStatus.filter(r => r['Stato (calcolato)'] === 'Futura').length;
        
        showAlert('info', 
          `📊 Caricate ${jsonData.length} righe. ` +
          `🟢 ${giocateCount} partite con risultato (Giocate), ` +
          `🔵 ${futureCount} partite senza risultato (Future). ` +
          `Verifica il mapping delle colonne.`
        );
      } catch (err) {
        console.error(err);
        showAlert('error', '❌ Errore nella lettura del file: ' + err.message);
      }
      setImporting(false);
    };
    reader.readAsArrayBuffer(file);
  };

  const getPreviewWithStatus = (rows) => {
    return rows.map(row => {
      let risultato = '';
      const colonneRisultato = ['Risultato', 'Result', 'Score', 'Ris', 'risultato'];
      for (const col of colonneRisultato) {
        if (row[col]) {
          const val = row[col].toString().trim();
          if (val && val !== '') {
            risultato = val;
            break;
          }
        }
      }
      
      if (!risultato) {
        for (const key of Object.keys(row)) {
          const val = row[key].toString().trim();
          if (val && /^\d+[-–:.]\d+$/.test(val)) {
            risultato = val;
            break;
          }
        }
      }
      
      const stato = (risultato && risultato !== '') ? 'Giocata' : 'Futura';
      
      return { 
        ...row, 
        'Stato (calcolato)': stato,
        'Risultato trovato': risultato || '-'
      };
    });
  };

  const handleMappingChange = (field, value) => {
    setMapping(prev => ({ ...prev, [field]: value }));
    
    if (parsedData.length > 0) {
      const previewWithStatus = getPreviewWithStatus(parsedData.slice(0, 10));
      setPreviewRows(previewWithStatus);
    }
  };

  const isMappingValid = () => {
    return requiredFields.every(f => mapping[f] && mapping[f].trim() !== '');
  };

  const importFromFile = () => {
    if (!isMappingValid()) {
      showAlert('error', '❌ Devi mappare almeno: Campionato, Data, Squadra Casa, Squadra Ospite.');
      return;
    }

    if (parsedData.length === 0) {
      showAlert('error', '❌ Nessun dato da importare.');
      return;
    }

    setImporting(true);
    setLoading(true);

    try {
      const existingKeys = new Set(matches.map(m => `${m.campionato}|${m.data}|${m.ora}|${m.casa}|${m.ospiti}`));
      const newMatches = [];
      const championshipsSet = new Set(championships.map(c => c.name));
      let importedCount = 0;
      let skippedCount = 0;
      let giocateCount = 0;
      let futureCount = 0;

      for (const row of parsedData) {
        const campionato = row[mapping.campionato]?.toString().trim() || 'Sconosciuto';
        const giornata = row[mapping.giornata]?.toString().trim() || 'N/A';
        const dataRaw = row[mapping.data]?.toString().trim() || '';
        const oraRaw = row[mapping.ora]?.toString().trim() || '';
        const squadraCasa = row[mapping.squadraCasa]?.toString().trim() || '';
        const squadraOspite = row[mapping.squadraOspite]?.toString().trim() || '';
        const risultatoRaw = row[mapping.risultato]?.toString().trim() || '';
        const golCasaRaw = row[mapping.golCasa]?.toString().trim();
        const golOspiteRaw = row[mapping.golOspite]?.toString().trim();
        const statoRaw = row[mapping.stato]?.toString().trim().toLowerCase() || '';

        if (!squadraCasa || !squadraOspite) {
          skippedCount++;
          continue;
        }

        let dataNormalizzata = normalizeDate(dataRaw);
        if (!dataNormalizzata) {
          skippedCount++;
          continue;
        }

        let stato = 'Futura';
        let golCasa = 0;
        let golOspite = 0;
        let risultato = '';

        if (risultatoRaw && risultatoRaw !== '') {
          const matchResult = risultatoRaw.match(/(\d+)\s*[-–:.]\s*(\d+)/);
          if (matchResult) {
            golCasa = parseInt(matchResult[1], 10);
            golOspite = parseInt(matchResult[2], 10);
            risultato = `${golCasa}-${golOspite}`;
          }
        }

        if (golCasaRaw && golCasaRaw !== '' && !isNaN(parseFloat(golCasaRaw))) {
          golCasa = parseFloat(golCasaRaw);
        }
        if (golOspiteRaw && golOspiteRaw !== '' && !isNaN(parseFloat(golOspiteRaw))) {
          golOspite = parseFloat(golOspiteRaw);
        }

        if (statoRaw === 'giocata' || statoRaw === 'played' || statoRaw === 'finished') {
          stato = 'Giocata';
        }

        if (risultato && risultato !== '') {
          stato = 'Giocata';
        }

        if (!risultato || risultato === '') {
          stato = 'Futura';
          golCasa = 0;
          golOspite = 0;
        }

        const key = `${campionato}|${dataNormalizzata}|${oraRaw}|${squadraCasa}|${squadraOspite}`;
        if (existingKeys.has(key)) {
          skippedCount++;
          continue;
        }
        existingKeys.add(key);

        const newMatch = {
          id: Math.random().toString(36).slice(2) + Date.now().toString(36),
          campionato: campionato,
          round: giornata,
          data: dataNormalizzata,
          ora: oraRaw || 'TBD',
          casa: squadraCasa,
          ospiti: squadraOspite,
          stato: stato,
          golCasa: stato === 'Giocata' ? golCasa : 0,
          golOspite: stato === 'Giocata' ? golOspite : 0,
          risultato: stato === 'Giocata' ? `${golCasa}-${golOspite}` : '',
          citta: 'N/D',
          _fromFile: true
        };

        newMatches.push(newMatch);
        
        if (stato === 'Giocata') {
          giocateCount++;
        } else {
          futureCount++;
        }

        if (!championshipsSet.has(campionato)) {
          championshipsSet.add(campionato);
        }
        importedCount++;
      }

      const allMatches = [...matches, ...newMatches];
      const uniqueMatches = deduplicateMatches(allMatches);
      
      const newChampionships = Array.from(championshipsSet).map(name => ({ 
        name, 
        importedAt: new Date().toISOString() 
      }));
      setChampionships(newChampionships);
      setMatches(uniqueMatches);

      const duplicatesRemoved = (matches.length + newMatches.length) - uniqueMatches.length;
      
      showAlert('success', 
        `✅ Importate ${importedCount} partite! ` +
        `🟢 ${giocateCount} Giocate, 🔵 ${futureCount} Future. ` +
        `${skippedCount > 0 ? `(${skippedCount} righe saltate)` : ''}` +
        `${duplicatesRemoved > 0 ? ` (${duplicatesRemoved} duplicati rimossi)` : ''}`
      );
      
      setFile(null);
      setParsedData([]);
      setPreviewRows([]);
      setColumns([]);
      setMapping({
        campionato: '',
        giornata: '',
        data: '',
        ora: '',
        squadraCasa: '',
        squadraOspite: '',
        golCasa: '',
        golOspite: '',
        stato: '',
        risultato: ''
      });
      if (fileInputRef.current) fileInputRef.current.value = '';

    } catch (err) {
      console.error(err);
      showAlert('error', '❌ Errore durante l\'importazione: ' + err.message);
    }

    setImporting(false);
    setLoading(false);
  };

  const resetFile = () => {
    setFile(null);
    setParsedData([]);
    setPreviewRows([]);
    setColumns([]);
    setMapping({
      campionato: '',
      giornata: '',
      data: '',
      ora: '',
      squadraCasa: '',
      squadraOspite: '',
      golCasa: '',
      golOspite: '',
      stato: '',
      risultato: ''
    });
    if (fileInputRef.current) fileInputRef.current.value = '';
  };

  return (
    <div className="card">
      <h4 style={{marginBottom:'8px'}}>📁 Importa da File (XLSX / CSV)</h4>
      <p style={{fontSize:'12px', color:'var(--text-muted)', marginBottom:'12px'}}>
        Carica un file Excel o CSV con le partite. Le colonne supportate sono: 
        <b> Campionato, Giornata, Data, Ora, Squadra Casa, Squadra Ospite, Gol Casa, Gol Ospite, Stato, Risultato</b>
      </p>
      <p style={{fontSize:'11px', color:'var(--text-muted)', marginBottom:'12px', background:'var(--surface)', padding:'8px', borderRadius:'6px'}}>
        💡 <b>Come funziona:</b> Se la colonna <b>Risultato</b> (es. "2-1") contiene un valore, la partita viene automaticamente marcata come <b>"Giocata"</b> e finisce nello <b>Storico</b>. 
        Se è vuota, rimane <b>"Futura"</b> nel <b>Palinsesto</b>.
      </p>

      <div 
        className={`file-drop-area ${isDragging ? 'dragging' : ''}`}
        onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
        onDragLeave={() => setIsDragging(false)}
        onDrop={handleFileDrop}
        onClick={() => fileInputRef.current?.click()}
      >
        <div style={{fontSize:'48px'}}>📂</div>
        <p style={{margin:'8px 0', fontWeight:'bold'}}>
          {file ? file.name : 'Trascina qui il file o clicca per selezionare'}
        </p>
        <p style={{fontSize:'12px', color:'var(--text-muted)'}}>
          Supporta .xlsx, .xls, .csv
        </p>
        <input 
          ref={fileInputRef}
          type="file" 
          accept=".xlsx,.xls,.csv" 
          onChange={handleFileSelect} 
          style={{display:'none'}}
        />
      </div>

      {file && parsedData.length > 0 && (
        <div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'12px', flexWrap:'wrap', gap:'8px'}}>
            <span style={{fontSize:'13px', color:'var(--text)'}}>
              📊 {parsedData.length} righe trovate • {previewRows.length} in anteprima
            </span>
            <div style={{display:'flex', gap:'8px'}}>
              <button className="btn btn-secondary" onClick={resetFile} disabled={importing}>🗑️ Rimuovi</button>
              <button className="btn" onClick={importFromFile} disabled={!isMappingValid() || importing || loading}>
                {importing || loading ? '⏳ Importazione...' : '📥 Importa'}
              </button>
            </div>
          </div>

          <div className="column-mapping">
            <div className="mapping-item">
              <label><b>Campionato *</b></label>
              <select value={mapping.campionato} onChange={e => handleMappingChange('campionato', e.target.value)}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
            </div>
            <div className="mapping-item">
              <label>Giornata</label>
              <select value={mapping.giornata} onChange={e => handleMappingChange('giornata', e.target.value)}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
            </div>
            <div className="mapping-item">
              <label><b>Data *</b></label>
              <select value={mapping.data} onChange={e => handleMappingChange('data', e.target.value)}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
            </div>
            <div className="mapping-item">
              <label>Ora</label>
              <select value={mapping.ora} onChange={e => handleMappingChange('ora', e.target.value)}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
            </div>
            <div className="mapping-item">
              <label><b>Squadra Casa *</b></label>
              <select value={mapping.squadraCasa} onChange={e => handleMappingChange('squadraCasa', e.target.value)}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
            </div>
            <div className="mapping-item">
              <label><b>Squadra Ospite *</b></label>
              <select value={mapping.squadraOspite} onChange={e => handleMappingChange('squadraOspite', e.target.value)}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
            </div>
            <div className="mapping-item">
              <label>Gol Casa</label>
              <select value={mapping.golCasa} onChange={e => handleMappingChange('golCasa', e.target.value)}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
            </div>
            <div className="mapping-item">
              <label>Gol Ospite</label>
              <select value={mapping.golOspite} onChange={e => handleMappingChange('golOspite', e.target.value)}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
            </div>
            <div className="mapping-item" style={{gridColumn: '1 / -1'}}>
              <label>Stato (Giocata/Futura)</label>
              <select value={mapping.stato} onChange={e => handleMappingChange('stato', e.target.value)}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
            </div>
            <div className="mapping-item" style={{gridColumn: '1 / -1'}}>
              <label style={{color: 'var(--accent)', fontWeight: 'bold'}}>🎯 Risultato (es. 2-1)</label>
              <select value={mapping.risultato} onChange={e => handleMappingChange('risultato', e.target.value)} style={{borderColor: 'var(--accent)'}}>
                <option value="">-- Seleziona colonna --</option>
                {columns.map(col => <option key={col} value={col}>{col}</option>)}
              </select>
              <span style={{fontSize:'10px', color:'var(--text-muted)', marginTop:'4px', display:'block'}}>
                💡 Se questa colonna contiene un risultato (es. "2-1"), la partita sarà marcata come <b style={{color:'var(--win)'}}>Giocata</b>
              </span>
            </div>
          </div>

          {previewRows.length > 0 && (
            <div className="file-preview">
              <table>
                <thead>
                  <tr>
                    {['#', ...Object.keys(previewRows[0])].map(col => (
                      <th key={col} style={{
                        color: col === 'Stato (calcolato)' ? 'var(--accent)' : 
                               col === 'Risultato trovato' ? 'var(--accent2)' : 'inherit'
                      }}>
                        {col === '#' ? '#' : col}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {previewRows.map((row, idx) => (
                    <tr key={idx} style={{
                      background: row['Stato (calcolato)'] === 'Giocata' ? 'rgba(111, 207, 151, 0.1)' : 'transparent'
                    }}>
                      {['#', ...Object.keys(row)].map((col, colIdx) => {
                        if (col === '#') {
                          return <td key={col} style={{color: 'var(--text-muted)', fontSize:'11px'}}>{idx + 1}</td>;
                        }
                        const value = row[col]?.toString() || '';
                        if (col === 'Stato (calcolato)') {
                          const isGiocata = value === 'Giocata';
                          return (
                            <td key={col} style={{
                              color: isGiocata ? 'var(--win)' : 'var(--text-muted)',
                              fontWeight: isGiocata ? 'bold' : 'normal',
                              background: isGiocata ? 'rgba(111, 207, 151, 0.2)' : 'transparent'
                            }}>
                              {isGiocata ? '🟢 Giocata' : '🔵 Futura'}
                            </td>
                          );
                        }
                        if (col === 'Risultato trovato' && value && value !== '-') {
                          return (
                            <td key={col} style={{
                              color: 'var(--accent)',
                              fontWeight: 'bold'
                            }}>
                              {value}
                            </td>
                          );
                        }
                        return <td key={col}>{value}</td>;
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
              {parsedData.length > 10 && (
                <div style={{padding:'8px', textAlign:'center', color:'var(--text-muted)', fontSize:'12px'}}>
                  ... e altre {parsedData.length - 10} righe
                </div>
              )}
            </div>
          )}
          
          {previewRows.length > 0 && (
            <div style={{marginTop:'12px', padding:'10px 14px', background:'var(--surface)', borderRadius:'8px', border:'1px solid var(--border)', display:'flex', gap:'20px', flexWrap:'wrap', fontSize:'13px'}}>
              <span>📊 Totale: <b>{parsedData.length}</b> righe</span>
              <span>🟢 Giocate: <b style={{color:'var(--win)'}}>
                {previewRows.filter(r => r['Stato (calcolato)'] === 'Giocata').length}
              </b></span>
              <span>🔵 Future: <b style={{color:'var(--text-muted)'}}>
                {previewRows.filter(r => r['Stato (calcolato)'] === 'Futura').length}
              </b></span>
              <span>🏆 Campionati: <b>
                {new Set(previewRows.map(r => r[mapping.campionato]?.toString().trim() || '')).size}
              </b></span>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

const AIAnalysis = ({ match, allMatches, apiKeys, setTab }) => {
  const [analysis, setAnalysis] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!match) return;
    const storageKey = `ft_ai_${match.id}`;
    const saved = localStorage.getItem(storageKey);
    if (saved) {
      try { const parsed = JSON.parse(saved); setAnalysis(parsed.analysis || null); setError(null); return; } catch (e) {}
    }
  }, [match]);

  const generateAnalysis = async () => {
    if (!match) return;
    if (!apiKeys['GROQ']) { setError('🔑 Chiave API GROQ non configurata'); setLoading(false); return; }
    setLoading(true);
    setError(null);

    try {
      const stats = computeMatchStats(match, allMatches);
      if (stats.error) { setError(stats.error); setLoading(false); return; }
      const homeForm = calcFormAndStats(allMatches, match.casa);
      const awayForm = calcFormAndStats(allMatches, match.ospiti);
      const homeMG = calcTeamMG(allMatches, match.casa);
      const awayMG = calcTeamMG(allMatches, match.ospiti);
      const pct12Under45 = get12Under45(allMatches, match.casa, match.ospiti);
      const homeRange = getMultigolRange(match.casa, allMatches);
      const awayRange = getMultigolRange(match.ospiti, allMatches);
      let over15Pct = 0;
      if (!stats.error && stats.underOver && stats.underOver[0]) {
        over15Pct = Math.round(stats.underOver[0].over);
      }

      const dcOptions = ['1X', '12', 'X2'];
      let bestDC = '';
      let bestDCPct = 0;
      const dcPcts = {
        '1X': stats.p1X || 0,
        '12': stats.p12 || 0,
        'X2': stats.pX2 || 0
      };
      for (const dc of dcOptions) {
        const pct = dcPcts[dc] || 0;
        if (pct > bestDCPct) {
          bestDCPct = pct;
          bestDC = dc;
        }
      }

      let over15PctLocal = 0;
      let under45PctLocal = 0;
      if (!stats.error && stats.underOver && stats.underOver[0]) {
        over15PctLocal = stats.underOver[0].over || 0;
      }
      under45PctLocal = pct12Under45 || 0;

      let bestOverUnder = '';
      let bestOverUnderPct = 0;
      if (over15PctLocal >= under45PctLocal) {
        bestOverUnder = 'Over 1.5';
        bestOverUnderPct = over15PctLocal;
      } else {
        bestOverUnder = 'Under 4.5';
        bestOverUnderPct = under45PctLocal;
      }

      const combinedPronostico = `${bestDC}+${bestOverUnder}`;
      const combinedPct = Math.round((bestDCPct + bestOverUnderPct) / 2);

      const prompt = `Sei un analista tattico professionista. Analizza la partita:

${match.casa} vs ${match.ospiti} - ${match.campionato}
Data: ${match.data}

📊 STATISTICHE:
- Forma Casa: ${homeForm.form} (${homeForm.pct}%)
- Forma Ospite: ${awayForm.form} (${awayForm.pct}%)
- Differenza: ${Math.abs(homeForm.pct - awayForm.pct)}%
- Media Gol Casa: ${homeMG} - Ospite: ${awayMG}

1X2: 1=${Math.round(stats.p1)}% X=${Math.round(stats.pX)}% 2=${Math.round(stats.p2)}%
Doppia Chance: 1X=${Math.round(stats.p1X)}% 12=${Math.round(stats.p12)}% X2=${Math.round(stats.pX2)}%

Under/Over:
- 1.5: U=${Math.round(stats.underOver[0].under)}% O=${Math.round(stats.underOver[0].over)}%
- 2.5: U=${Math.round(stats.underOver[1].under)}% O=${Math.round(stats.underOver[1].over)}%
- 3.5: U=${Math.round(stats.underOver[2].under)}% O=${Math.round(stats.underOver[2].over)}%

Multigol Casa: 0-1=${Math.round(stats.homeMG['0-1'])}% 0-2=${Math.round(stats.homeMG['0-2'])}% 1-3=${Math.round(stats.homeMG['1-3'])}% 2-5=${Math.round(stats.homeMG['2-5'])}%
Multigol Ospite: 0-1=${Math.round(stats.awayMG['0-1'])}% 0-2=${Math.round(stats.awayMG['0-2'])}% 1-3=${Math.round(stats.awayMG['1-3'])}% 2-5=${Math.round(stats.awayMG['2-5'])}%

Genera un'analisi in formato JSON:
{
  "analisi_generale": "Panoramica della partita (2-3 righe)",
  "pronostico": {
    "esito_1X2": "1, X o 2",
    "percentuale_sicurezza": 75,
    "12+under_4_5": "Sì",
    "12+under_4_5_pct": ${Math.round(pct12Under45)},
    "motivazione": "Motivazione"
  },
  "consigli_giocate": [

    {"tipo":"over","giocata":"Over 1.5","percentuale":${over15Pct}}
  ],
  "indice_rischio": 5,
  "valutazione_giocata": "Valutazione"
}`;

      const res = await askGroq(prompt, apiKeys['GROQ']);
      let jsonStr = res;
      const jsonMatch = res.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (jsonMatch) jsonStr = jsonMatch[1];
      const parsed = JSON.parse(jsonStr.trim());

      if (parsed.pronostico) {
        parsed.pronostico.esito_1X2 = combinedPronostico;
        parsed.pronostico.percentuale_sicurezza = combinedPct;
        parsed.pronostico.motivazione = `Basato sul miglior DC (${bestDC} al ${Math.round(bestDCPct)}%) e la migliore tra Over 1.5 (${Math.round(over15PctLocal)}%) e Under 4.5 (${Math.round(under45PctLocal)}%)`;
      }

      if (parsed.consigli_giocate && parsed.consigli_giocate.length >= 3) {
        parsed.consigli_giocate[0] = { tipo: "singola", giocata: `12+U4.5`, percentuale: Math.round(pct12Under45) };
        parsed.consigli_giocate[1] = { tipo: "combinata", giocata: `COMBINATA: ${match.casa} ${homeRange.label} + ${match.ospiti} ${awayRange.label}`, percentuale: Math.round((homeRange.pct + awayRange.pct) / 2) };
        parsed.consigli_giocate[2] = { tipo: "over", giocata: `Over 1.5`, percentuale: over15Pct };
      }

      const storageKey = `ft_ai_${match.id}`;
      localStorage.setItem(storageKey, JSON.stringify({ analysis: parsed }));

      setAnalysis(parsed);
      setError(null);
    } catch (e) {
      console.warn('Errore analisi AI:', e);
      setError(e.message || 'Errore durante la generazione');
    }
    setLoading(false);
  };

  const refreshAnalysis = () => {
    if (match) { const storageKey = `ft_ai_${match.id}`; localStorage.removeItem(storageKey); generateAnalysis(); }

  const goToApiKey = () => { if (setTab) setTab('API KEY'); };

  if (!match) return null;

  if (loading) { return <div className="ai-analysis-loading">⏳ Generazione analisi AI...</div>; }

  if (error) {
    const isKeyError = error.includes('GROQ') || error.includes('chiave');
    return (
      <div className="ai-analysis-error">
        <span>⚠️ {error}</span>

  if (!analysis) {

  const { analisi_generale, pronostico, consigli_giocate, indice_rischio, valutazione_giocata } = analysis;

  const renderPct = (value) => {

      <p style={{fontSize:'14px', lineHeight:'1.6', color:'var(--text)'}}>{analisi_generale || 'N/A'}</p>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px', background:'var(--card)', padding:'12px', borderRadius:'8px', marginTop:'12px', border:'2px solid var(--accent)'}}>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>Pronostico</div>
          <div style={{fontSize:'24px', fontWeight:'bold', color:'var(--accent)'}}>{pronostico?.esito_1X2 || 'N/D'}</div>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>Sicurezza</div>
          <div style={{fontSize:'24px', fontWeight:'bold', color: (pronostico?.percentuale_sicurezza || 0) >= 80 ? 'var(--win)' : 'var(--accent)'}}>{pronostico?.percentuale_sicurezza || 0}%</div>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>12+Under 4.5</div>
          <div style={{fontSize:'18px', fontWeight:'bold', color:'var(--accent)'}}>{pronostico?.['12+under_4_5'] || 'No'}{pronostico?.['12+under_4_5_pct'] !== undefined && <span style={{fontSize:'12px', color:'var(--text-muted)', marginLeft:'4px'}}>({pronostico['12+under_4_5_pct']}%)</span>}</div>

        </div>
      </div>

      {consigli_giocate && consigli_giocate.length > 0 && (
        <>
          <h4 style={{fontSize:'14px', fontWeight:'bold', color:'var(--text)', marginTop:'12px', marginBottom:'8px'}}>🎯 Consigli Giocate</h4>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px'}}>
            {consigli_giocate.map((c, idx) => {
              const isBomb = c.percentuale >= 90;
              const pct = c.percentuale || 0;
              const cls = getPercentualeClasse(pct);
              return (

                  <div style={{fontSize:'22px', fontWeight:'bold', marginTop:'4px'}}>

              );
            })}
          </div>

      {valutazione_giocata && <div style={{marginTop:'12px', background:'var(--card)', padding:'10px', borderRadius:'6px', border:'1px solid var(--border)'}}><div style={{fontWeight:'bold', color:'var(--accent)', fontSize:'13px'}}>📈 Valutazione Giocata</div><div style={{fontSize:'13px', color:'var(--text)'}}>{valutazione_giocata}</div></div>}

      <div style={{marginTop:'12px'}}>

        </span>
      </div>
    </div>
  );
};

const WeatherProfessionale = ({ weatherData, city, matchDate }) => {
  if (!weatherData) {
    return (
      <div className="weather-professionale" style={{textAlign: 'center', color: 'var(--text-muted)'}}>
        <div style={{fontSize: '48px', marginBottom: '8px'}}>🌤️</div>
        <p>Dati meteo non disponibili per {city || 'questa località'}</p>
        <p style={{fontSize: '12px'}}>Open-Meteo è gratuito e non richiede chiave API</p>
      </div>
    );
  }

  const getWeatherIcon = (desc, rain) => {
    if (!desc) return '🌤️';
    const d = desc.toLowerCase();
    
    if (rain > 5) return '🌧️';
    if (rain > 1) return '🌦️';
    
    if (d.includes('sereno')) return '☀️';
    if (d.includes('nuvoloso') || d.includes('coperto')) return '☁️';
    if (d.includes('nebbia')) return '🌫️';
    if (d.includes('pioggia')) return '🌧️';
    if (d.includes('temporale')) return '⛈️';
    if (d.includes('neve')) return '❄️';
    return '🌤️';
  };

  const getRiskLevel = (weather) => {
    let risk = 0;
    if (weather.rain > 5) risk += 3;
    else if (weather.rain > 1) risk += 2;
    else if (weather.rain > 0.5) risk += 1;
    if (weather.wind_speed > 15) risk += 3;
    else if (weather.wind_speed > 10) risk += 2;
    else if (weather.wind_speed > 5) risk += 1;
    if (weather.temp < -5 || weather.temp > 35) risk += 2;
    else if (weather.temp < 0 || weather.temp > 30) risk += 1;
    if (weather.weather && (weather.weather.includes('Temporale') || weather.weather.includes('temporale'))) risk += 3;
    
    if (risk >= 6) return { level: 'high', label: '🔴 ALTO - Rischio di rinvio o condizioni proibitive', color: 'var(--lose)' };
    if (risk >= 4) return { level: 'medium', label: '🟡 MEDIO - Possibili difficoltà per i giocatori', color: 'var(--draw)' };
    if (risk >= 2) return { level: 'low', label: '🟢 BASSO - Condizioni accettabili', color: 'var(--win)' };
    return { level: 'low', label: '🟢 OTTIMALE - Condizioni perfette per il calcio', color: 'var(--win)' };
  };

  const risk = getRiskLevel(weatherData);
  const icon = getWeatherIcon(weatherData.weather, weatherData.rain);

  return (
    <div className="weather-professionale">
      <div className="weather-header">
        <div className="weather-icon-main">{icon}</div>
        <div className="weather-info-main">
          <div className="weather-temp-main">{Math.round(weatherData.temp)}°C</div>
          <div className="weather-desc-main">{weatherData.weather || 'N/A'}</div>
          <div className="weather-city-main">📍 {city || 'Località non specificata'} • 📅 {weatherData.forecast_date || matchDate || 'N/A'}</div>
        </div>
        <div style={{textAlign: 'right', minWidth: '100px'}}>
          <div style={{fontSize: '14px', color: 'var(--text-muted)'}}>Temp. min/max</div>
          <div style={{fontSize: '20px', fontWeight: 'bold', color: 'var(--accent)'}}>
            {Math.round(weatherData.temp_min)}° / {Math.round(weatherData.temp_max)}°
          </div>
        </div>
      </div>

      <div className="weather-details-grid">
        <div className="weather-detail-item">
          <div className="wd-icon">💨</div>
          <div className="wd-value">{Math.round(weatherData.wind_speed)} m/s</div>
          <div className="wd-label">Vento</div>
        </div>
        <div className="weather-detail-item">
          <div className="wd-icon">🌧️</div>
          <div className="wd-value">{weatherData.rain > 0 ? weatherData.rain + ' mm' : '0 mm'}</div>
          <div className="wd-label">Precipitazioni</div>
        </div>
      </div>

      <div className="weather-risk">
        <span className="risk-icon">⚠️</span>
        <span className="risk-text"><b>Valutazione meteo:</b> {risk.label}</span>
        <span className={`risk-badge ${risk.level}`}>{risk.level.toUpperCase()}</span>
      </div>
    </div>
  );
};

const CittaMeteo = ({ matches }) => {
  const [cities, setCities] = useState([]);
  useEffect(() => {
    const uniqueCities = new Set();
    matches.forEach(m => {
      const city = getCityForMatch(m.casa, m.campionato);
      if (city) uniqueCities.add(city);
    });
    setCities(Array.from(uniqueCities).sort());
  }, [matches]);
  return (
    <div className="card">
      <h4>🌍 Città Meteo ({cities.length})</h4>
      <div className="citta-meteo-grid">
        {cities.map(city => {
          const squadre = matches.filter(m => getCityForMatch(m.casa, m.campionato) === city).map(m => m.casa);
          const uniqueSquadre = [...new Set(squadre)];
          return (
            <div key={city} className="citta-meteo-item">
              <span className="citta-nome">📍 {city}</span>
              <span className="citta-squadre">{uniqueSquadre.slice(0, 3).join(', ')}{uniqueSquadre.length > 3 ? ` +${uniqueSquadre.length - 3}` : ''}</span>
            </div>
          );
        })}
      </div>
      <div style={{fontSize: '11px', color: 'var(--text-muted)', marginTop: '8px'}}>💡 Open-Meteo è gratuito e non richiede chiave API</div>
    </div>
  );
};

                        <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: 'var(--text-muted)', marginTop: '2px'}}><span>70%</span><span style={{fontWeight: 'bold', color: 'var(--accent)'}}>{fontSize}%</span><span>150%</span></div>
                      </div>
                      <button className="btn btn-secondary" onClick={() => setFontSize(prev => Math.min(150, prev + 5))} style={{fontSize: '18px', fontWeight: 'bold', padding: '8px 16px', minWidth: '44px', minHeight: '44px', borderRadius: '8px', border: '1px solid var(--border)', background: 'var(--surface)', color: 'var(--text)', cursor: 'pointer'}}>+</button>
                      <button className="btn btn-secondary" onClick={() => setFontSize(100)} style={{fontSize: '12px', padding: '8px 16px', borderRadius: '8px', border: '1px solid var(--border)', background: 'var(--surface)', color: 'var(--text)', cursor: 'pointer'}}>🔄 Reset (100%)</button>
                    </div>
                    <div style={{marginTop: '12px', fontSize: '12px', color: 'var(--text-muted)', borderTop: '1px solid var(--border)', paddingTop: '10px'}}>
                      <div style={{display: 'flex', gap: '16px', flexWrap: 'wrap'}}><span>📱 <b>Consigliato:</b> 100% (PC) / 110-120% (Mobile)</span><span>💡 La modifica si applica immediatamente a tutta l'app</span></div>
                      <div style={{marginTop: '6px', padding: '8px 12px', borderRadius: '6px', background: 'var(--surface)', border: '1px solid var(--border)', fontSize: `${fontSize}%`, transition: 'font-size 0.2s'}}><span style={{fontWeight: 'bold'}}>Anteprima:</span> Questo è un testo di esempio alla dimensione <b>{fontSize}%</b></div>
                    </div>
                  </div>
                </div>
              )}
              {settingsTab === 'Città Meteo' && (
                <div>
                  <CittaMeteo matches={matches} />
                </div>
              )}
              {settingsTab === 'Visuale' && (
                <div className="card">
                  <h3 style={{marginBottom: '12px'}}>📱 Cambia Visuale</h3>
                  <div style={{display: 'flex', gap: '16px', flexWrap: 'wrap'}}>
                    <button 
                      className={`btn ${viewMode === 'pc' ? '' : 'btn-secondary'}`} 
                      onClick={() => {
                        setViewMode('pc');
                        setTimeout(() => window.scrollTo(0, 0), 100);
                      }} 
                      style={{flex: 1, minWidth: '120px'}}
                    >
                      🖥️ PC
                    </button>
                    <button 
                      className={`btn ${viewMode === 'mobile' ? '' : 'btn-secondary'}`} 
                      onClick={() => {
                        setViewMode('mobile');
                        setTimeout(() => window.scrollTo(0, 0), 100);
                      }} 
                      style={{flex: 1, minWidth: '120px'}}
                    >
                      📱 Telefono
                    </button>
                  </div>
                  <div style={{marginTop: '12px', fontSize: '13px', color: 'var(--text-muted)'}}>
                    Modalità attuale: <b>{viewMode === 'pc' ? '🖥️ PC' : '📱 Telefono'}</b>
                  </div>
                  <div style={{marginTop: '8px', fontSize: '12px', color: 'var(--text-muted)'}}>
                    {viewMode === 'mobile' 
                      ? '✅ La visuale è ottimizzata per schermi piccoli. Il contenuto si adatta automaticamente.'
                      : '✅ Visuale ottimizzata per schermi grandi. Massima visibilità dei dati.'}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>

        {/* DISCLAIMER COMMERCIALE */}
        <div className="disclaimer-footer">
          <div style={{display: 'flex', gap: '12px', alignItems: 'flex-start', flexWrap: 'wrap'}}>
            <span style={{fontSize: '24px'}}>⚠️</span>
            <div style={{flex: 1}}>
              <p style={{margin: '0 0 6px 0'}}>
                <strong>⚠️ Disclaimer - Utilizzo in Centro Scommesse</strong>
              </p>
              <p style={{margin: '0 0 4px 0'}}>
                Questa applicazione fornisce analisi statistiche a <strong>solo scopo informativo</strong>. 
                I dati provengono da <strong>file caricati dall'utente</strong> (XLSX/CSV). 
                Le percentuali e i pronostici sono <strong>elaborazioni matematiche non vincolanti</strong>.
              </p>
              <p style={{margin: '0 0 4px 0'}}>
                <span className="highlight">⚠️ Le scommesse comportano rischi finanziari. Gioca responsabilmente.</span>
              </p>
              <p style={{margin: '0', fontSize: '10px', color: 'var(--text-muted)'}}>
                I loghi e i nomi delle squadre sono di proprietà dei rispettivi titolari. 
                L'uso commerciale dei dati richiede licenza specifica.
              </p>
            </div>
          </div>
        </div>

        <button 
          className="home-btn-overlay" 
          onClick={() => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }}
          title="Torna su"
        >
          🏠
        </button>
      </div>
    );
  };

  // Se la modalità è mobile, mostriamo l'app dentro il simulatore
  if (viewMode === 'mobile') {
    return (
      <div style={{display: 'flex', justifyContent: 'center', alignItems: 'flex-start', padding: '20px', minHeight: '100vh', background: '#0a0a1a'}}>
        <div className="phone-simulator">
          <div className="phone-notch">
            <div className="notch-speaker"></div>
            <div className="notch-camera"></div>
          </div>
          <div className="phone-screen">
            <div className="phone-scroll" style={{paddingTop: '32px'}}>
              {renderAppContent()}
            </div>
            <div className="phone-home-indicator"></div>
          </div>
        </div>
      </div>
    );
  }

  // Modalità PC - rendering normale
  return renderAppContent();
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
