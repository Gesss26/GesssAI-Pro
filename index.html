const AIAnalysis = ({ match, allMatches, apiKeys, setTab }) => {
  const [analysis, setAnalysis] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!match) return;
    const storageKey = `ft_ai_${match.id}`;
    const saved = localStorage.getItem(storageKey);
    if (saved) {
      try { const parsed = JSON.parse(saved); setAnalysis(parsed.analysis || null); setError(null); return; } catch (e) {}
    }
  }, [match]);

  const generateAnalysis = async () => {
    if (!match) return;
    if (!apiKeys['GROQ']) { setError('🔑 Chiave API GROQ non configurata'); setLoading(false); return; }
    setLoading(true);
    setError(null);

    try {
      const stats = computeMatchStats(match, allMatches);
      if (stats.error) { setError(stats.error); setLoading(false); return; }
      const homeForm = calcFormAndStats(allMatches, match.casa);
      const awayForm = calcFormAndStats(allMatches, match.ospiti);
      const homeMG = calcTeamMG(allMatches, match.casa);
      const awayMG = calcTeamMG(allMatches, match.ospiti);
      const pct12Under45 = get12Under45(allMatches, match.casa, match.ospiti);
      const homeRange = getMultigolRange(match.casa, allMatches);
      const awayRange = getMultigolRange(match.ospiti, allMatches);
      let over15Pct = 0;
      if (!stats.error && stats.underOver && stats.underOver[0]) {
        over15Pct = Math.round(stats.underOver[0].over);
      }

      const prompt = `Sei un analista tattico professionista. Analizza la partita:

${match.casa} vs ${match.ospiti} - ${match.campionato}
Data: ${match.data}

📊 STATISTICHE:
- Forma Casa: ${homeForm.form} (${homeForm.pct}%)
- Forma Ospite: ${awayForm.form} (${awayForm.pct}%)
- Differenza: ${Math.abs(homeForm.pct - awayForm.pct)}%
- Media Gol Casa: ${homeMG} - Ospite: ${awayMG}

1X2: 1=${Math.round(stats.p1)}% X=${Math.round(stats.pX)}% 2=${Math.round(stats.p2)}%
Doppia Chance: 1X=${Math.round(stats.p1X)}% 12=${Math.round(stats.p12)}% X2=${Math.round(stats.pX2)}%

Under/Over:
- 1.5: U=${Math.round(stats.underOver[0].under)}% O=${Math.round(stats.underOver[0].over)}%
- 2.5: U=${Math.round(stats.underOver[1].under)}% O=${Math.round(stats.underOver[1].over)}%
- 3.5: U=${Math.round(stats.underOver[2].under)}% O=${Math.round(stats.underOver[2].over)}%

Multigol Casa: 0-1=${Math.round(stats.homeMG['0-1'])}% 0-2=${Math.round(stats.homeMG['0-2'])}% 1-3=${Math.round(stats.homeMG['1-3'])}% Over1,5=${Math.round(stats.homeMG['2-4'])}%
Multigol Ospite: 0-1=${Math.round(stats.awayMG['0-1'])}% 0-2=${Math.round(stats.awayMG['0-2'])}% 1-3=${Math.round(stats.awayMG['1-3'])}% Over1,5=${Math.round(stats.awayMG['2-4'])}%

Genera un'analisi in formato JSON:
{
  "analisi_generale": "Panoramica della partita (2-3 righe)",
  "pronostico": {
    "esito_1X2": "1, X o 2",
    "percentuale_sicurezza": 75,
    "12+under_4_5": "Sì",
    "12+under_4_5_pct": ${Math.round(pct12Under45)},
    "motivazione": "Motivazione"
  },
  "consigli_giocate": [
    {"tipo":"singola","giocata":"12+U4.5","percentuale":${Math.round(pct12Under45)}},
    {"tipo":"combinata","giocata":"COMBINATA: ${match.casa} ${homeRange.label} + ${match.ospiti} ${awayRange.label}","percentuale":${Math.round((homeRange.pct + awayRange.pct) / 2)}},
    {"tipo":"over","giocata":"Over 1.5","percentuale":${over15Pct}}
  ],
  "indice_rischio": 5,
  "valutazione_giocata": "Valutazione"
}`;

      const res = await askGroq(prompt, apiKeys['GROQ']);
      let jsonStr = res;
      const jsonMatch = res.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (jsonMatch) jsonStr = jsonMatch[1];
      const parsed = JSON.parse(jsonStr.trim());

      if (parsed.consigli_giocate && parsed.consigli_giocate.length >= 3) {
        parsed.consigli_giocate[0] = { tipo: "singola", giocata: `12+U4.5`, percentuale: Math.round(pct12Under45) };
        parsed.consigli_giocate[1] = { tipo: "combinata", giocata: `COMBINATA: ${match.casa} ${homeRange.label} + ${match.ospiti} ${awayRange.label}`, percentuale: Math.round((homeRange.pct + awayRange.pct) / 2) };
        parsed.consigli_giocate[2] = { tipo: "over", giocata: `Over 1.5`, percentuale: over15Pct };
      }

      const storageKey = `ft_ai_${match.id}`;
      localStorage.setItem(storageKey, JSON.stringify({ analysis: parsed }));

      setAnalysis(parsed);
      setError(null);
    } catch (e) {
      console.warn('Errore analisi AI:', e);
      setError(e.message || 'Errore durante la generazione');
    }
    setLoading(false);
  };

  const refreshAnalysis = () => {
    if (match) { const storageKey = `ft_ai_${match.id}`; localStorage.removeItem(storageKey); generateAnalysis(); }
  };

  const goToApiKey = () => { if (setTab) setTab('API KEY'); };

  if (!match) return null;

  if (loading) { return <div className="ai-analysis-loading">⏳ Generazione analisi AI...</div>; }

  if (error) {
    const isKeyError = error.includes('GROQ') || error.includes('chiave');
    return (
      <div className="ai-analysis-error">
        <span>⚠️ {error}</span>
        {isKeyError && <div><button className="btn-go-key" onClick={goToApiKey}>🔑 Vai al tab API KEY</button></div>}
        {!isKeyError && <div style={{marginTop:'8px'}}><button className="btn-go-key" onClick={refreshAnalysis}>🔄 Riprova</button></div>}
      </div>
    );
  }

  if (!analysis) {
    return (
      <div className="card">
        <button className="btn" onClick={generateAnalysis}>🤖 Genera Analisi AI</button>
      </div>
    );
  }

  const { analisi_generale, pronostico, consigli_giocate, indice_rischio, valutazione_giocata } = analysis;

  const renderPct = (value) => {
    const rounded = Math.round(value);
    const cls = getPercentualeClasse(rounded);
    return <span className={`giocata-pct ${cls}`}>{rounded}%</span>;
  };

  return (
    <div className="ai-analysis-box">
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'12px', flexWrap:'wrap', gap:'8px'}}>
        <h3 style={{color: getChampColor(match.campionato), margin:0, fontSize:'16px'}}>🤖 Analisi AI Avanzata</h3>
        <button onClick={refreshAnalysis} style={{background:'transparent', border:'none', color:'var(--text-muted)', cursor:'pointer', fontSize:'13px'}}>🔄 Aggiorna</button>
      </div>

      <h4 style={{fontSize:'14px', fontWeight:'bold', color:'var(--text)', marginTop:'12px', marginBottom:'4px'}}>📋 Analisi Generale</h4>
      <p style={{fontSize:'14px', lineHeight:'1.6', color:'var(--text)'}}>{analisi_generale || 'N/A'}</p>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px', background:'var(--card)', padding:'12px', borderRadius:'8px', marginTop:'12px', border:'2px solid var(--accent)'}}>
        <div style={{textAlign:'center'}}><div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>Pronostico 1X2</div><div style={{fontSize:'24px', fontWeight:'bold', color:'var(--accent)'}}>{pronostico?.esito_1X2 || 'N/D'}</div></div>
        <div style={{textAlign:'center'}}><div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>Sicurezza</div><div style={{fontSize:'24px', fontWeight:'bold', color: (pronostico?.percentuale_sicurezza || 0) >= 80 ? 'var(--win)' : 'var(--accent)'}}>{pronostico?.percentuale_sicurezza || 0}%</div></div>
        <div style={{textAlign:'center'}}><div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>12+Under 4.5</div><div style={{fontSize:'18px', fontWeight:'bold', color:'var(--accent)'}}>{pronostico?.['12+under_4_5'] || 'No'}{pronostico?.['12+under_4_5_pct'] !== undefined && <span style={{fontSize:'12px', color:'var(--text-muted)', marginLeft:'4px'}}>({pronostico['12+under_4_5_pct']}%)</span>}</div></div>
        <div style={{gridColumn: '1 / -1', borderTop:'1px solid var(--border)', paddingTop:'8px'}}><div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>Motivazione</div><div style={{fontSize:'13px', color:'var(--text)'}}>{pronostico?.motivazione || ''}</div></div>
      </div>

      {consigli_giocate && consigli_giocate.length > 0 && (
        <>
          <h4 style={{fontSize:'14px', fontWeight:'bold', color:'var(--text)', marginTop:'12px', marginBottom:'8px'}}>🎯 Consigli Giocate</h4>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px'}}>
            {consigli_giocate.map((c, idx) => {
              const isBomb = c.percentuale >= 90;
              const pct = c.percentuale || 0;
              const cls = getPercentualeClasse(pct);
              return (
                <div key={idx} style={{background:'var(--card)', padding:'12px', borderRadius:'6px', border: isBomb ? '2px solid var(--accent)' : '1px solid var(--border)', textAlign:'center'}}>
                  <div style={{fontSize:'10px', color:'var(--text-muted)', textTransform:'uppercase'}}>{idx === 0 && '🎯 12+U4.5'}{idx === 1 && '🔗 COMBINATA'}{idx === 2 && '⚽ OVER 1.5'}</div>
                  <div style={{fontSize:'14px', fontWeight:'bold', color:'#ffff00', margin:'4px 0'}}>{c.giocata}</div>
                  <div style={{fontSize:'22px', fontWeight:'bold', marginTop:'4px'}}>
                    <span className={`giocata-pct ${cls}`}>
                      {Math.round(pct)}% {isBomb && <span className="bomb-icon">💣</span>}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}

      {valutazione_giocata && <div style={{marginTop:'12px', background:'var(--card)', padding:'10px', borderRadius:'6px', border:'1px solid var(--border)'}}><div style={{fontWeight:'bold', color:'var(--accent)', fontSize:'13px'}}>📈 Valutazione Giocata</div><div style={{fontSize:'13px', color:'var(--text)'}}>{valutazione_giocata}</div></div>}

      <div style={{marginTop:'12px'}}>
        <span style={{background:'var(--card)', padding:'4px 16px', borderRadius:'20px', fontSize:'13px', display:'inline-block', border:'1px solid var(--border)'}}>
          🎯 Indice Rischio: <span style={{fontWeight:'bold', color: (indice_rischio || 5) > 7 ? 'var(--lose)' : (indice_rischio || 5) > 4 ? 'var(--draw)' : 'var(--win)'}}>{indice_rischio || 'N/D'}/10</span>
        </span>
      </div>
    </div>
  );
};

const WeatherProfessionale = ({ weatherData, city, matchDate }) => {
  if (!weatherData) {
    return (
      <div className="weather-professionale" style={{textAlign: 'center', color: 'var(--text-muted)'}}>
        <div style={{fontSize: '48px', marginBottom: '8px'}}>🌤️</div>
        <p>Dati meteo non disponibili per {city || 'questa località'}</p>
        <p style={{fontSize: '12px'}}>Configura WorldWeatherOnline nel tab API KEY</p>
      </div>
    );
  }

  const getWeatherIcon = (desc) => {
    if (!desc) return '🌤️';
    const d = desc.toLowerCase();
    if (d.includes('clear') || d.includes('sunny')) return '☀️';
    if (d.includes('few cloud')) return '🌤️';
    if (d.includes('cloud') || d.includes('overcast')) return '☁️';
    if (d.includes('rain') && d.includes('light')) return '🌦️';
    if (d.includes('rain')) return '🌧️';
    if (d.includes('thunder') || d.includes('storm')) return '⛈️';
    if (d.includes('snow')) return '❄️';
    if (d.includes('fog') || d.includes('mist')) return '🌫️';
    return '🌤️';
  };

  const getRiskLevel = (weather) => {
    let risk = 0;
    if (weather.rain > 5) risk += 3;
    else if (weather.rain > 1) risk += 2;
    else if (weather.rain > 0.5) risk += 1;
    if (weather.wind_speed > 15) risk += 3;
    else if (weather.wind_speed > 10) risk += 2;
    else if (weather.wind_speed > 5) risk += 1;
    if (weather.temp < -5 || weather.temp > 35) risk += 2;
    else if (weather.temp < 0 || weather.temp > 30) risk += 1;
    if (weather.weather && (weather.weather.includes('thunder') || weather.weather.includes('storm'))) risk += 3;
    
    if (risk >= 6) return { level: 'high', label: '🔴 ALTO - Rischio di rinvio o condizioni proibitive', color: 'var(--lose)' };
    if (risk >= 4) return { level: 'medium', label: '🟡 MEDIO - Possibili difficoltà per i giocatori', color: 'var(--draw)' };
    if (risk >= 2) return { level: 'low', label: '🟢 BASSO - Condizioni accettabili', color: 'var(--win)' };
    return { level: 'low', label: '🟢 OTTIMALE - Condizioni perfette per il calcio', color: 'var(--win)' };
  };

  const risk = getRiskLevel(weatherData);
  const icon = getWeatherIcon(weatherData.weather);

  return (
    <div className="weather-professionale">
      <div className="weather-header">
        <div className="weather-icon-main">{icon}</div>
        <div className="weather-info-main">
          <div className="weather-temp-main">{Math.round(weatherData.temp)}°C</div>
          <div className="weather-desc-main">{weatherData.weather || 'N/A'}</div>
          <div className="weather-city-main">📍 {city || 'Località non specificata'} • 📅 {weatherData.forecast_date || matchDate || 'N/A'}</div>
        </div>
        <div style={{textAlign: 'right', minWidth: '100px'}}>
          <div style={{fontSize: '14px', color: 'var(--text-muted)'}}>Temp. min/max</div>
          <div style={{fontSize: '20px', fontWeight: 'bold', color: 'var(--accent)'}}>
            {Math.round(weatherData.temp_min)}° / {Math.round(weatherData.temp_max)}°
          </div>
        </div>
      </div>

      <div className="weather-details-grid">
        <div className="weather-detail-item">
          <div className="wd-icon">💨</div>
          <div className="wd-value">{Math.round(weatherData.wind_speed)} m/s</div>
          <div className="wd-label">Vento</div>
        </div>
        <div className="weather-detail-item">
          <div className="wd-icon">💧</div>
          <div className="wd-value">{weatherData.humidity || 'N/A'}%</div>
          <div className="wd-label">Umidità</div>
        </div>
        <div className="weather-detail-item">
          <div className="wd-icon">🌧️</div>
          <div className="wd-value">{weatherData.rain > 0 ? weatherData.rain + ' mm' : '0 mm'}</div>
          <div className="wd-label">Precipitazioni</div>
        </div>
        <div className="weather-detail-item">
          <div className="wd-icon">📊</div>
          <div className="wd-value">{weatherData.pressure || 'N/A'} hPa</div>
          <div className="wd-label">Pressione</div>
        </div>
      </div>

      <div className="weather-risk">
        <span className="risk-icon">⚠️</span>
        <span className="risk-text"><b>Valutazione meteo:</b> {risk.label}</span>
        <span className={`risk-badge ${risk.level}`}>{risk.level.toUpperCase()}</span>
      </div>
    </div>
  );
};

          newMatches.push({

              if (playedMatches.length === 0) { return <div className="empty-state">Nessuna partita giocata.</div>; }
              return <div className="matches-grid">{playedMatches.map(m => <MatchTabHistory key={m.id} match={m} onSelect={selectMatch} />)}</div>;
            })()}
          </div>
        )}

        {tab === 'API KEY' && (
          <div>
            <h2 style={{marginBottom:'14px'}}>🔑 Gestione API Key</h2>
            <div className="alert alert-info">💡 <b>GROQ</b> per l'AI. <b>WorldWeatherOnline</b> per il meteo. <b>API-Football</b> per infortuni e statistiche avanzate.</div>
            {['GROQ','WorldWeatherOnline','API-Football'].map(name => (
              <div key={name} className="card">
                <h3>
                  {name === 'GROQ' && '🧠'} {name === 'WorldWeatherOnline' && '🌦️'} {name === 'API-Football' && '⚽'} {name}
                </h3>
                <div className="form-group" style={{marginTop:'10px'}}>
                  <label>API Key</label>
                  <input type="password" value={tempKeys[name] || ''} onChange={e => setTempKeys({ ...tempKeys, [name]: e.target.value })} placeholder={`Inserisci la tua key ${name}`} />
                </div>
                <div style={{display:'flex', gap:'8px', flexWrap:'wrap'}}>
                  <button className="btn btn-secondary" onClick={() => testApiKey(name)}>🧪 Test</button>
                  <button className="btn" onClick={() => confirmApiKey(name)}>💾 Conferma</button>
                  {apiTestResult[name] && <span style={{padding:'10px', color: apiTestResult[name]==='OK' ? 'var(--win)' : 'var(--lose)'}}><b>Test: {apiTestResult[name]}</b></span>}
                  {apiKeys[name] && <span style={{padding:'10px', color:'var(--win)'}}>✅ Configurata</span>}
                </div>
              </div>
            ))}
          </div>
        )}

        {tab === 'Impostazioni' && (
          <div>
            <div className="tabs-sub">
              {SETTINGS_TABS.map(t => <button key={t} className={settingsTab === t ? 'active' : ''} onClick={() => setSettingsTab(t)}>{t === 'Temi' && '🎨 '}{t === 'API KEY' && '🔑 '}{t === 'Dati Locali' && '💾 '}{t === 'Importa Campionato' && '📥 '}{t === 'Grandezza Caratteri' && '📏 '}{t === 'Città Meteo' && '🌍 '}{t === 'Visuale' && '📱 '}{t}</button>)}
            </div>
            {settingsTab === 'Temi' && (
              <div>
                <h3 style={{marginBottom:'12px'}}>🎨 Scegli un Tema</h3>
                <div className="theme-grid">
                  {Object.entries(THEMES).map(([name, t]) => <div key={name} className={`theme-card ${theme === name ? 'active' : ''}`} style={{background: t.card, color: t.text, borderColor: theme === name ? t.accent : t.border}} onClick={() => setTheme(name)}><div className="theme-name" style={{color: t.accent}}>{name}</div><div style={{display:'flex', gap:'4px', justifyContent:'center', marginTop:'6px'}}><div style={{width:'20px',height:'20px',background:t.bg,borderRadius:'50%'}}></div><div style={{width:'20px',height:'20px',background:t.accent,borderRadius:'50%'}}></div><div style={{width:'20px',height:'20px',background:t.text,borderRadius:'50%'}}></div></div></div>)}
                  <div className={`theme-card ${theme === 'Custom' ? 'active' : ''}`} style={{background: customTheme.card, color: customTheme.text, borderColor: theme === 'Custom' ? customTheme.accent : customTheme.border}} onClick={() => setTheme('Custom')}><div className="theme-name" style={{color: customTheme.accent}}>🎨 Custom</div></div>
                </div>
                {theme === 'Custom' && <div className="card" style={{marginTop:'20px'}}><h3 style={{marginBottom:'12px'}}>Personalizza Colori</h3>{[['Sfondo','bg'],['Superficie','surface'],['Card','card'],['Banner','banner'],['Testo','text'],['Testo Muted','textMuted'],['Accento','accent'],['Accento 2','accent2'],['Bordo','border']].map(([label, key]) => <div key={key} className="color-picker-row"><input type="color" value={customTheme[key]} onChange={e => setCustomTheme({ ...customTheme, [key]: e.target.value })} /><span>{label}</span></div>)}</div>}
              </div>
            )}
            {settingsTab === 'API KEY' && <div><p style={{color:'var(--text-muted)'}}>Le API Key sono gestite nel TAB dedicato.</p><button className="btn" onClick={() => setTab('API KEY')} style={{marginTop:'10px'}}>🔑 Vai al TAB API KEY</button></div>}
            {settingsTab === 'Dati Locali' && (
              <div>
                <h3 style={{marginBottom:'12px'}}>💾 Salvataggio / Caricamento</h3>
                <div className="card">
                  <p style={{marginBottom:'12px'}}>I dati vengono salvati automaticamente in localStorage.</p>
                  <button className="btn" onClick={saveLocal} style={{marginRight:'8px'}}>💾 Scarica Backup JSON</button>
                  <hr style={{margin:'14px 0', borderColor:'var(--border)'}}/>
                  <label style={{display:'block', marginBottom:'6px'}}>📂 Carica Backup JSON</label>
                  <input type="file" accept=".json" onChange={e => e.target.files[0] && loadLocal(e.target.files[0])} />
                  <hr style={{margin:'14px 0', borderColor:'var(--border)'}}/>
                  <button className="btn btn-danger" onClick={() => { if (confirm('Vuoi davvero resettare TUTTI i dati?')) { localStorage.clear(); saveBlacklist([]); saveCustomSofaLeagues([]); localStorage.removeItem('ft_football_data_imported'); localStorage.removeItem('ft_sportsapipro_imported'); setChampionships([]); setMatches([]); setApiKeys({}); setTempKeys({}); setSchedineHistory([]); setRefreshSofaTrigger(prev => prev + 1); showAlert('success', '🗑️ Dati resettati completamente.'); } }}>🗑️ Reset Completo</button>
                </div>
              </div>
            )}
            {settingsTab === 'Importa Campionato' && (
              <div>
                <h3 style={{marginBottom:'12px'}}>📥 Importa Campionato</h3>
                <div className="sub-tabs" style={{marginBottom:'16px'}}>
                  <button className="active" onClick={() => {}}>🌐 SofaScore</button>
                  <button onClick={() => {}}>📁 File</button>
                </div>
                <SofaScoreManager onImport={importFromSofaScore} loading={loading} matches={matches} setMatches={setMatches} refreshTrigger={refreshSofaTrigger} showAlert={showAlert} />
                <FileImporter 
                  matches={matches} 
                  setMatches={setMatches} 
                  championships={championships} 
                  setChampionships={setChampionships} 
                  loading={loading} 
                  setLoading={setLoading} 
                  showAlert={showAlert} 
                />
                <hr style={{borderColor:'var(--border)', margin:'20px 0'}}/>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', margin:'20px 0 12px', flexWrap:'wrap', gap:'10px'}}>
                  <h3 style={{margin:0}}>📋 Campionati Importati</h3>
                  <div style={{display:'flex', gap:'8px', flexWrap:'wrap'}}>
                    <button className="btn" style={{background: 'var(--accent)', color: '#000'}} onClick={importAllFromSofaScore} disabled={loading}>📥 Importa Tutti</button>
                    <button className="btn btn-danger" onClick={clearAllChampionships}>🗑️ Elimina Tutti</button>
                  </div>
                </div>
                {championships.length === 0 ? <div className="empty-state">Nessun campionato importato.</div> : (
                  <div className="champ-list">
                    {championships.map(c => {
                      const totalMatches = matches.filter(m => m.campionato === c.name).length;
                      const futureMatches = matches.filter(m => m.campionato === c.name && m.stato === 'Futura').length;
                      const playedMatches = matches.filter(m => m.campionato === c.name && m.stato === 'Giocata').length;
                      return (
                        <div key={c.name} className="champ-item" style={{borderLeft: `4px solid ${getChampColor(c.name)}`, paddingLeft:'12px'}}>
                          <div><b>{c.name}</b><div style={{fontSize:'11px', color:'var(--text-muted)'}}>{totalMatches} partite ({futureMatches} future, {playedMatches} giocate) <span style={{marginLeft:'8px', fontSize:'10px', color:'var(--text-muted)'}}>📅 {new Date(c.importedAt).toLocaleDateString()}</span></div></div>
                          <button className="btn btn-danger" onClick={() => { if (confirm(`Eliminare ${c.name} e tutte le sue partite?`)) { setChampionships(championships.filter(x => x.name !== c.name)); setMatches(matches.filter(m => m.campionato !== c.name)); } }}>🗑️ Elimina</button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
            {settingsTab === 'Grandezza Caratteri' && (
              <div>
                <div className="card">
                  <h3 style={{marginBottom: '12px'}}>📏 Grandezza Caratteri</h3>
                  <div style={{display: 'flex', alignItems: 'center', gap: '16px', flexWrap: 'wrap'}}>
                    <button className="btn btn-secondary" onClick={() => setFontSize(prev => Math.max(70, prev - 5))} style={{fontSize: '18px', fontWeight: 'bold', padding: '8px 16px', minWidth: '44px', minHeight: '44px', borderRadius: '8px', border: '1px solid var(--border)', background: 'var(--surface)', color: 'var(--text)', cursor: 'pointer'}}>−</button>
                    <div style={{flex: 1, minWidth: '150px'}}>
                      <input type="range" min="70" max="150" step="5" value={fontSize} onChange={(e) => setFontSize(parseInt(e.target.value))} style={{width: '100%', accentColor: 'var(--accent)', height: '6px', borderRadius: '3px', background: 'var(--surface)', cursor: 'pointer'}} />
                      <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: 'var(--text-muted)', marginTop: '2px'}}><span>70%</span><span style={{fontWeight: 'bold', color: 'var(--accent)'}}>{fontSize}%</span><span>150%</span></div>
                    </div>
                    <button className="btn btn-secondary" onClick={() => setFontSize(prev => Math.min(150, prev + 5))} style={{fontSize: '18px', fontWeight: 'bold', padding: '8px 16px', minWidth: '44px', minHeight: '44px', borderRadius: '8px', border: '1px solid var(--border)', background: 'var(--surface)', color: 'var(--text)', cursor: 'pointer'}}>+</button>
                    <button className="btn btn-secondary" onClick={() => setFontSize(100)} style={{fontSize: '12px', padding: '8px 16px', borderRadius: '8px', border: '1px solid var(--border)', background: 'var(--surface)', color: 'var(--text)', cursor: 'pointer'}}>🔄 Reset (100%)</button>
                  </div>
                  <div style={{marginTop: '12px', fontSize: '12px', color: 'var(--text-muted)', borderTop: '1px solid var(--border)', paddingTop: '10px'}}>
                    <div style={{display: 'flex', gap: '16px', flexWrap: 'wrap'}}><span>📱 <b>Consigliato:</b> 100% (PC) / 110-120% (Mobile)</span><span>💡 La modifica si applica immediatamente a tutta l'app</span></div>
                    <div style={{marginTop: '6px', padding: '8px 12px', borderRadius: '6px', background: 'var(--surface)', border: '1px solid var(--border)', fontSize: `${fontSize}%`, transition: 'font-size 0.2s'}}><span style={{fontWeight: 'bold'}}>Anteprima:</span> Questo è un testo di esempio alla dimensione <b>{fontSize}%</b></div>
                  </div>
                </div>
              </div>
            )}
            {settingsTab === 'Città Meteo' && (
              <div>
                <CittaMeteo matches={matches} />
              </div>
            )}
            {settingsTab === 'Visuale' && (
              <div className="card">
                <h3 style={{marginBottom: '12px'}}>📱 Cambia Visuale</h3>
                <div style={{display: 'flex', gap: '16px', flexWrap: 'wrap'}}>
                  <button className={`btn ${viewMode === 'pc' ? '' : 'btn-secondary'}`} onClick={() => setViewMode('pc')} style={{flex: 1, minWidth: '120px'}}>🖥️ PC</button>
                  <button className={`btn ${viewMode === 'mobile' ? '' : 'btn-secondary'}`} onClick={() => setViewMode('mobile')} style={{flex: 1, minWidth: '120px'}}>📱 Telefono</button>
                </div>
                <div style={{marginTop: '12px', fontSize: '13px', color: 'var(--text-muted)'}}>
                  Modalità attuale: <b>{viewMode === 'pc' ? '🖥️ PC' : '📱 Telefono'}</b>
                </div>
                <div style={{marginTop: '8px', fontSize: '12px', color: 'var(--text-muted)'}}>
                  {viewMode === 'mobile' 
                    ? '✅ La visuale è ottimizzata per schermi piccoli. Il contenuto si adatta automaticamente.'
                    : '✅ Visuale ottimizzata per schermi grandi. Massima visibilità dei dati.'}
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      <button 
        className="home-btn-overlay" 
        onClick={() => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }}
        title="Torna su"
      >
        🏠
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
